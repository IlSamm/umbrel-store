name: Filament Finder image

on:
  push:
    branches:
      - master
      - filament-finder-10.5-smart-deals
      - filament-finder-10.6-source-status
    paths:
      - 'ilsamm-filament-finder/**'
      - '.github/workflows/filament-finder-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: filament-finder-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate 10.6 source syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check ilsamm-filament-finder/ui-v10/app.js
          node --check ilsamm-filament-finder/ui-v101/material-details.js
          node --check ilsamm-filament-finder/ui-v102/material-accordions.js
          node --check ilsamm-filament-finder/ui-v102/price-sources.js
          node --check ilsamm-filament-finder/ui-v102/marketplace-capture.js
          node --check ilsamm-filament-finder/ui-v104/price-quality.js
          node --check ilsamm-filament-finder/ui-v105/deal-engine.js
          node --check ilsamm-filament-finder/ui-v106/source-status.js
          python -m py_compile ilsamm-filament-finder/runtime/build_runtime.py
          python -m py_compile ilsamm-filament-finder/runtime/patch_runtime_v102.py
          python -m py_compile ilsamm-filament-finder/runtime/patch_runtime_v104.py
          python -m py_compile ilsamm-filament-finder/runtime/patch_runtime_v105.py
          python -m py_compile ilsamm-filament-finder/runtime/patch_runtime_v105_official_promos.py
          python -m py_compile ilsamm-filament-finder/runtime/patch_runtime_v106.py
          grep -q '.ff103-overview' ilsamm-filament-finder/ui-v102/price-sources.css
          grep -q "const VERSION='10.4.0'" ilsamm-filament-finder/ui-v104/price-quality.js
          grep -q "const VERSION='10.5.0'" ilsamm-filament-finder/ui-v105/deal-engine.js
          grep -q "const VERSION='10.6.0'" ilsamm-filament-finder/ui-v106/source-status.js
          grep -q 'FF106_ENRICH_SOURCE_STATUS' ilsamm-filament-finder/ui-v106/source-status.js
          grep -q 'Nessun risultato' ilsamm-filament-finder/ui-v106/source-status.js
          grep -q 'Timeout' ilsamm-filament-finder/ui-v106/source-status.js
          grep -q '.ff106-source-status-panel' ilsamm-filament-finder/ui-v106/source-status.css
          grep -q "source.get('id')=='sunlu'" ilsamm-filament-finder/runtime/patch_runtime_v105_official_promos.py
          grep -q 'version: "10.6.0"' ilsamm-filament-finder/umbrel-app.yml
          grep -q 'filament-finder:10.6.0' ilsamm-filament-finder/docker-compose.yml

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push 10.6.0
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ilsamm-filament-finder/runtime/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ilsamm/filament-finder:10.6.0
            ghcr.io/ilsamm/filament-finder:latest
          provenance: false

      - name: Smoke, smart-deals and source-status test
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io || true
          docker pull ghcr.io/ilsamm/filament-finder:10.6.0
          docker run -d --name filament-finder-test -p 18765:8765 ghcr.io/ilsamm/filament-finder:10.6.0
          trap 'docker logs filament-finder-test || true' EXIT

          for i in $(seq 1 30); do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18765/api/health', timeout=2).read()"; then break; fi
            sleep 1
          done

          python - <<'PY'
          import json, time, urllib.request
          BASE='http://127.0.0.1:18765'
          def get(path, timeout=10):
              with urllib.request.urlopen(BASE+path, timeout=timeout) as r:
                  assert r.status == 200, r.status
                  return json.load(r)

          health=get('/api/health')
          assert health['ok'] is True
          assert health['version']=='10.6.0', health
          assert health['materials']==67, health
          assert health['brands']==18, health
          assert health['sources']>=11, health

          started=time.time()
          live=get('/api/catalog?material=PLA&brand=all&qty=10&refresh=1', timeout=35)
          elapsed=time.time()-started
          active=[s for s in live['sources'] if s.get('results',0)>0]
          promos=[o for o in live['offers'] if o.get('promo_tiers') or o.get('promo_code') or o.get('free_shipping_threshold')]
          assert len(live['offers'])>=20, len(live['offers'])
          assert len(live['sources'])>=11, len(live['sources'])
          assert any(str(s.get('id'))=='bambu' for s in live['sources']), live['sources']
          assert len(active)>=3, active
          assert elapsed<30, elapsed
          print('BACKEND_MARKET_106_OK', {
              'offers':len(live['offers']),
              'sources':len(live['sources']),
              'active_sources':[(s.get('id'),s.get('kind'),s.get('results'),s.get('ok')) for s in active],
              'promo_rows':len(promos),
              'elapsed_s':round(elapsed,2)
          })

          sunlu=get('/api/catalog?material=PLA&brand=all&qty=10&refresh=1&source=sunlu', timeout=30)
          sunlu_rows=[o for o in sunlu.get('offers',[]) if str(o.get('source_id'))=='sunlu']
          sunlu_promos=[o for o in sunlu_rows if o.get('promo_tiers')]
          assert sunlu_rows, sunlu
          assert sunlu_promos, 'SUNLU offers found but no verified quantity tiers were extracted'
          assert any(any(int(t.get('min_qty') or 0)>=10 for t in o.get('promo_tiers',[])) for o in sunlu_promos), sunlu_promos[:3]
          PY

          command -v google-chrome >/dev/null
          python -m pip install --quiet websocket-client
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --remote-debugging-port=9222 --remote-debugging-address=127.0.0.1 --remote-allow-origins=* \
            --user-data-dir=/tmp/ff-chrome \
            http://127.0.0.1:18765 >/tmp/ff-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill $CHROME_PID 2>/dev/null || true; docker logs filament-finder-test || true' EXIT

          python - <<'PY'
          import json, time, urllib.request
          from websocket import create_connection

          deadline=time.time()+15
          targets=[]
          while time.time()<deadline:
              try:
                  targets=json.load(urllib.request.urlopen('http://127.0.0.1:9222/json',timeout=2))
                  targets=[t for t in targets if t.get('type')=='page']
                  if targets: break
              except Exception:
                  pass
              time.sleep(.25)
          assert targets, 'Chrome DevTools page target not found'
          ws=create_connection(targets[0]['webSocketDebuggerUrl'],timeout=20)
          counter=0
          def evaluate(expr):
              global counter
              counter+=1
              ws.send(json.dumps({'id':counter,'method':'Runtime.evaluate','params':{'expression':expr,'returnByValue':True,'awaitPromise':True}}))
              while True:
                  msg=json.loads(ws.recv())
                  if msg.get('id')==counter:
                      if 'exceptionDetails' in msg.get('result',{}):
                          raise AssertionError(msg['result']['exceptionDetails'])
                      return msg['result']['result'].get('value')

          deadline=time.time()+12
          while time.time()<deadline and not evaluate("document.readyState==='complete' && !!document.querySelector('#ff10-app .ff10-nav')"):
              time.sleep(.2)

          assert evaluate("window.FF104_PRICE_QUALITY_VERSION==='10.4.0'")
          assert evaluate("window.FF105_DEAL_ENGINE_VERSION==='10.5.0'")
          assert evaluate("window.FF106_SOURCE_STATUS_VERSION==='10.6.0'")
          assert evaluate("typeof window.FF106_ENRICH_SOURCE_STATUS==='function'")
          assert evaluate("typeof window.FF106_STATUS_OF==='function'")

          synthetic=evaluate("JSON.stringify(window.FF106_ENRICH_SOURCE_STATUS({sources:[{id:'ok',name:'OK source',ok:true,results:5,ms:100},{id:'empty',name:'Empty source',ok:true,results:0,ms:80},{id:'error',name:'Error source',ok:false,results:0,error_message:'HTTP 500'},{id:'timeout',name:'Timeout source',ok:false,results:0,error_message:'request timeout'}],offers:[]}))")
          synthetic=json.loads(synthetic)
          statuses={s['id']:s['status'] for s in synthetic['sources']}
          assert statuses=={'ok':'ok','empty':'empty','error':'error','timeout':'timeout'}, statuses
          summary=synthetic['source_status_summary']
          assert summary['total']==4 and summary['ok']==1 and summary['empty']==1 and summary['error']==1 and summary['timeout']==1, summary
          print('SOURCE_STATUS_CLASSIFICATION_OK', statuses)

          bulk=evaluate("JSON.stringify(window.FF105_ENRICH_CATALOG({quantity:10,offers:[{source_id:'test',store:'Test',product:'PLA Basic 1kg',price:20,weight_kg:1,final_total:200,final_perkg:20,ff104_packages:10,ff104_purchased_kg:10,promo_tiers:[{kind:'percent',min_qty:10,discount_pct:40,verified:true,label:'10+ bobine · -40%'}]}],sources:[{id:'test',name:'Test',ok:true,results:1}]},{qty:10}))")
          offer=json.loads(bulk)['offers'][0]
          assert abs(offer['final_total']-120)<0.01, offer
          assert abs(offer['ff105_bulk_savings']-80)<0.01, offer

          evaluate("document.querySelector('.ff10-nav [data-nav=\"prices\"]').click()")
          deadline=time.time()+4
          while time.time()<deadline and not evaluate("!!document.querySelector('#ff10-price-qty option[value=\"10\"]')"):
              time.sleep(.1)
          assert evaluate("!!document.querySelector('#ff10-price-qty option[value=\"10\"]')")
          evaluate("(()=>{const s=document.querySelector('#ff10-price-material');const pla=[...s.options].find(o=>String(o.value).toUpperCase()==='PLA'||/^PLA$/i.test(o.textContent.trim()));if(pla){s.value=pla.value;s.dispatchEvent(new Event('change',{bubbles:true}));}const qty=document.querySelector('#ff10-price-qty');qty.value='10';qty.dispatchEvent(new Event('change',{bubbles:true}));document.querySelector('[data-market-run]').click();return true;})()")

          deadline=time.time()+30
          def real_result_ready():
              return bool(evaluate("!!document.querySelector('#ff10-market-results .ff103-overview') && !!document.querySelector('#ff10-market-results .ff105-deals-panel') && !!document.querySelector('#ff10-market-results .ff106-source-status-panel') && window.FF106_LAST_DATA?.sources?.length>=11"))
          while time.time()<deadline and not real_result_ready():
              time.sleep(.25)
          assert real_result_ready(), 'real marketplace/source-status result did not finish'
          assert evaluate("document.querySelectorAll('.ff106-source-card').length===window.FF106_LAST_DATA.sources.length")
          assert evaluate("window.FF106_LAST_DATA.sources.every(s=>['ok','empty','error','timeout'].includes(s.status))")
          assert evaluate("document.querySelector('.ff106-summary-card.is-ok')?.textContent.includes('OK')")
          assert evaluate("document.querySelector('.ff106-summary-card.is-empty')?.textContent.includes('Nessun risultato')")
          assert evaluate("document.querySelector('.ff106-summary-card.is-error')?.textContent.includes('Errore')")
          assert evaluate("document.querySelector('.ff106-summary-card.is-timeout')?.textContent.includes('Timeout')")
          assert evaluate("document.documentElement.scrollWidth<=innerWidth+2")
          print('FILAMENT_FINDER_10_6_SOURCE_STATUS_UI_OK')
          ws.close()
          PY

          kill $CHROME_PID || true
          trap - EXIT
          docker inspect filament-finder-test --format '{{.State.Status}} {{.State.Health.Status}}'
          docker logs filament-finder-test
