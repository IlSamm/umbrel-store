name: Filament Finder image

on:
  push:
    branches:
      - master
    paths:
      - 'ilsamm-filament-finder/**'
      - '.github/workflows/filament-finder-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: filament-finder-image-master
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate 10.4 source syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check ilsamm-filament-finder/ui-v10/app.js
          node --check ilsamm-filament-finder/ui-v101/material-details.js
          node --check ilsamm-filament-finder/ui-v102/material-accordions.js
          node --check ilsamm-filament-finder/ui-v102/price-sources.js
          node --check ilsamm-filament-finder/ui-v102/marketplace-capture.js
          node --check ilsamm-filament-finder/ui-v104/price-quality.js
          python -m py_compile ilsamm-filament-finder/runtime/build_runtime.py
          python -m py_compile ilsamm-filament-finder/runtime/patch_runtime_v102.py
          python -m py_compile ilsamm-filament-finder/runtime/patch_runtime_v104.py
          grep -q '.ff103-overview' ilsamm-filament-finder/ui-v102/price-sources.css
          grep -q "const VERSION='10.3.0'" ilsamm-filament-finder/ui-v102/price-sources.js
          grep -q "const VERSION='10.4.0'" ilsamm-filament-finder/ui-v104/price-quality.js
          grep -q 'FF104_CLEAN_CATALOG' ilsamm-filament-finder/ui-v104/price-quality.js
          grep -q 'version: "10.4.0"' ilsamm-filament-finder/umbrel-app.yml

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push 10.4.0
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ilsamm-filament-finder/runtime/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ilsamm/filament-finder:10.4.0
            ghcr.io/ilsamm/filament-finder:latest
          provenance: false

      - name: Smoke and price-quality test
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io || true
          docker pull ghcr.io/ilsamm/filament-finder:10.4.0
          docker run -d --name filament-finder-test -p 18765:8765 ghcr.io/ilsamm/filament-finder:10.4.0
          trap 'docker logs filament-finder-test || true' EXIT

          for i in $(seq 1 30); do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18765/api/health', timeout=2).read()"; then break; fi
            sleep 1
          done

          python - <<'PY'
          import json, time, urllib.request
          BASE='http://127.0.0.1:18765'
          def get(path, timeout=10):
              with urllib.request.urlopen(BASE+path, timeout=timeout) as r:
                  assert r.status == 200, r.status
                  return json.load(r)

          health=get('/api/health')
          assert health['ok'] is True
          assert health['version']=='10.4.0', health
          assert health['materials']==67, health
          assert health['brands']==18, health
          assert health['sources']>=11, health

          started=time.time()
          live=get('/api/catalog?material=PLA&brand=all&qty=1&refresh=1', timeout=30)
          elapsed=time.time()-started
          active=[s for s in live['sources'] if s.get('results',0)>0]
          assert len(live['offers'])>=20, len(live['offers'])
          assert len(live['sources'])>=11, len(live['sources'])
          assert len(active)>=3, active
          assert elapsed<25, elapsed
          print('BACKEND_MARKET_OK', {'offers':len(live['offers']),'active_sources':len(active),'elapsed_s':round(elapsed,2)})
          PY

          command -v google-chrome >/dev/null
          python -m pip install --quiet websocket-client
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --remote-debugging-port=9222 --remote-debugging-address=127.0.0.1 --remote-allow-origins=* \
            --user-data-dir=/tmp/ff-chrome \
            http://127.0.0.1:18765 >/tmp/ff-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill $CHROME_PID 2>/dev/null || true; docker logs filament-finder-test || true' EXIT

          python - <<'PY'
          import json, time, urllib.request
          from websocket import create_connection

          deadline=time.time()+15
          targets=[]
          while time.time()<deadline:
              try:
                  targets=json.load(urllib.request.urlopen('http://127.0.0.1:9222/json',timeout=2))
                  targets=[t for t in targets if t.get('type')=='page']
                  if targets: break
              except Exception:
                  pass
              time.sleep(.25)
          assert targets, 'Chrome DevTools page target not found'
          ws=create_connection(targets[0]['webSocketDebuggerUrl'],timeout=20)
          counter=0
          def evaluate(expr):
              global counter
              counter+=1
              ws.send(json.dumps({'id':counter,'method':'Runtime.evaluate','params':{'expression':expr,'returnByValue':True,'awaitPromise':True}}))
              while True:
                  msg=json.loads(ws.recv())
                  if msg.get('id')==counter:
                      if 'exceptionDetails' in msg.get('result',{}):
                          raise AssertionError(msg['result']['exceptionDetails'])
                      return msg['result']['result'].get('value')

          deadline=time.time()+12
          while time.time()<deadline and not evaluate("document.readyState==='complete' && !!document.querySelector('#ff10-app .ff10-nav')"):
              time.sleep(.2)

          assert evaluate("window.FF104_PRICE_QUALITY_VERSION==='10.4.0'")
          assert evaluate("typeof window.FF104_CLEAN_CATALOG==='function'")

          # Deterministic test: 500 g PLA must be doubled to satisfy a 1 kg search;
          # PETG and an accessory must be removed before the marketplace sees them.
          mock=evaluate("JSON.stringify(window.FF104_CLEAN_CATALOG({offers:[{source_id:'test',store:'Test',product:'PLA Basic 500g',brand:'Test',price:10,url:'https://example.com/pla'},{source_id:'test',store:'Test',product:'PETG 1kg',price:8,url:'https://example.com/petg'},{source_id:'test',store:'Test',product:'PLA nozzle 0.4mm',price:4,url:'https://example.com/nozzle'}],sources:[{id:'test',name:'Test',ok:true,results:3}]},{material:'PLA Basic',qty:'1'}))")
          mock=json.loads(mock)
          assert len(mock['offers'])==1, mock
          offer=mock['offers'][0]
          assert offer['ff104_packages']==2, offer
          assert abs(offer['final_total']-20)<0.01, offer
          assert abs(offer['final_perkg']-20)<0.01, offer
          assert mock['quality']['excluded']==2, mock['quality']

          # Test the real mobile marketplace flow.
          evaluate("document.querySelector('.ff10-nav [data-nav=\"prices\"]').click()")
          time.sleep(.2)
          assert evaluate("document.querySelector('#ff10-price-qty option[value=\"1\"]').textContent.includes('kg')")
          assert evaluate("document.querySelector('#ff10-price-qty').closest('.ff10-field').textContent.includes('Quantità di materiale')")
          evaluate("(()=>{const s=document.querySelector('#ff10-price-material');const pla=[...s.options].find(o=>String(o.value).toUpperCase()==='PLA'||/^PLA$/i.test(o.textContent.trim()));if(pla){s.value=pla.value;s.dispatchEvent(new Event('change',{bubbles:true}));}document.querySelector('[data-market-run]').click();return true;})()")
          deadline=time.time()+22
          while time.time()<deadline and not evaluate("!!document.querySelector('#ff10-market-results .ff103-overview')"):
              time.sleep(.25)
          assert evaluate("!!document.querySelector('#ff10-market-results .ff103-overview')")
          assert evaluate("window.FF104_PRICE_QUALITY_LAST && window.FF104_PRICE_QUALITY_LAST.target_kg===1")
          assert evaluate("window.FF104_PRICE_QUALITY_LAST.relevant_offers<=window.FF104_PRICE_QUALITY_LAST.raw_offers")
          assert evaluate("document.querySelectorAll('.ff103-offer-card').length>0")
          assert evaluate("document.documentElement.scrollWidth<=innerWidth+2")
          print('FILAMENT_FINDER_10_4_UI_OK')
          ws.close()
          PY

          kill $CHROME_PID || true
          trap - EXIT
          docker inspect filament-finder-test --format '{{.State.Status}} {{.State.Health.Status}}'
          docker logs filament-finder-test
