name: Filament Finder image

on:
  push:
    branches:
      - master
      - filament-finder-10.1-material-details
    paths:
      - 'ilsamm-filament-finder/**'
      - '.github/workflows/filament-finder-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate 10.1 source syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check ilsamm-filament-finder/ui-v10/app.js
          node --check ilsamm-filament-finder/ui-v101/material-details.js
          python -m py_compile ilsamm-filament-finder/runtime/build_runtime.py
          grep -q '#ff10-app' ilsamm-filament-finder/ui-v10/app.css
          grep -q '.ff101-material-sheet' ilsamm-filament-finder/ui-v101/material-details.css
          grep -q "const VERSION='10.1.0'" ilsamm-filament-finder/ui-v101/material-details.js

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push 10.1.0
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ilsamm-filament-finder/runtime/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ilsamm/filament-finder:10.1.0
            ghcr.io/ilsamm/filament-finder:latest
          provenance: false

      - name: Smoke, live-price and material-detail UI test
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io || true
          docker pull ghcr.io/ilsamm/filament-finder:10.1.0
          docker run -d --name filament-finder-test -p 18765:8765 ghcr.io/ilsamm/filament-finder:10.1.0
          trap 'docker logs filament-finder-test || true' EXIT
          for i in $(seq 1 30); do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18765/api/health', timeout=2).read()"; then break; fi
            sleep 1
          done

          python - <<'PY'
          import json, time, urllib.request
          BASE='http://127.0.0.1:18765'
          def get(path, timeout=10):
              with urllib.request.urlopen(BASE+path, timeout=timeout) as r:
                  assert r.status == 200, r.status
                  return json.load(r)
          health=get('/api/health')
          assert health['ok'] is True
          assert health['version']=='10.1.0', health
          assert health['materials']==67, health
          assert health['brands']==18, health
          assert health['sources']>=11, health
          started=time.time()
          live=get('/api/catalog?material=PLA&brand=all&qty=1&refresh=1', timeout=30)
          elapsed=time.time()-started
          assert len(live['offers'])>0, live
          assert any(s['ok'] for s in live['sources']), live['sources']
          assert elapsed<25, elapsed
          print('API_OK', {
              'health':health['version'],
              'offers':len(live['offers']),
              'sources_ok':sum(1 for s in live['sources'] if s['ok']),
              'sources_total':len(live['sources']),
              'elapsed_s':round(elapsed,2)
          })
          PY

          command -v google-chrome >/dev/null
          python -m pip install --quiet websocket-client
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --remote-debugging-port=9222 --remote-debugging-address=127.0.0.1 --remote-allow-origins=* \
            --user-data-dir=/tmp/ff-chrome \
            http://127.0.0.1:18765 >/tmp/ff-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill $CHROME_PID 2>/dev/null || true; docker logs filament-finder-test || true' EXIT

          python - <<'PY'
          import json, time, urllib.request
          from websocket import create_connection

          deadline=time.time()+15
          targets=[]
          while time.time()<deadline:
              try:
                  targets=json.load(urllib.request.urlopen('http://127.0.0.1:9222/json',timeout=2))
                  targets=[t for t in targets if t.get('type')=='page']
                  if targets: break
              except Exception:
                  pass
              time.sleep(.25)
          assert targets, 'Chrome DevTools page target not found'
          ws=create_connection(targets[0]['webSocketDebuggerUrl'],timeout=10)
          counter=0

          def command(method, params=None):
              global counter
              counter+=1
              ws.send(json.dumps({'id':counter,'method':method,'params':params or {}}))
              while True:
                  msg=json.loads(ws.recv())
                  if msg.get('id')==counter:
                      if 'error' in msg: raise AssertionError(msg['error'])
                      return msg.get('result',{})

          def evaluate(expr):
              global counter
              counter+=1
              ws.send(json.dumps({'id':counter,'method':'Runtime.evaluate','params':{'expression':expr,'returnByValue':True,'awaitPromise':True}}))
              while True:
                  msg=json.loads(ws.recv())
                  if msg.get('id')==counter:
                      if 'exceptionDetails' in msg.get('result',{}): raise AssertionError(msg['result']['exceptionDetails'])
                      return msg['result']['result'].get('value')

          command('Emulation.setDeviceMetricsOverride',{
              'width':390,'height':844,'deviceScaleFactor':3,'mobile':True,
              'screenWidth':390,'screenHeight':844
          })
          command('Emulation.setTouchEmulationEnabled',{'enabled':True,'maxTouchPoints':5})
          command('Page.reload',{'ignoreCache':True})

          deadline=time.time()+12
          while time.time()<deadline and not evaluate("document.readyState==='complete' && !!document.querySelector('#ff10-app .ff10-nav')"):
              time.sleep(.2)

          checks={
            'viewport_width': "innerWidth===390",
            'version': "window.FILAMENT_FINDER_VERSION==='10.1.0'",
            'new_app_mounted': "!!document.querySelector('#ff10-app') && document.body.classList.contains('ff10-mounted')",
            'legacy_hidden': "getComputedStyle(document.querySelector('#ff10-legacy')).display==='none'",
            'no_page_horizontal_overflow': "document.documentElement.scrollWidth<=innerWidth+2",
            'nav_compact': "document.querySelector('.ff10-nav').getBoundingClientRect().height<=72",
            'five_nav_items': "document.querySelectorAll('.ff10-nav button').length===5",
            'new_material_cards_present': "document.querySelectorAll('#ff10-view-materials .ff10-material').length>=20",
            'advisor_new_textarea': "!!document.querySelector('#ff10-project')",
            'prices_new_controls': "document.querySelectorAll('#ff10-price-material option').length>=20",
          }
          for name,expr in checks.items():
              ok=evaluate(expr)
              print(name,ok)
              assert ok,name

          material_count=evaluate("document.querySelectorAll('#ff10-view-materials .ff10-material').length")
          print('material_cards',material_count)
          assert material_count>=60, material_count

          evaluate("document.querySelector('.ff10-nav [data-nav=\"materials\"]').click()")
          time.sleep(.2)
          assert evaluate("document.querySelector('#ff10-view-materials').classList.contains('is-active')")

          evaluate("document.querySelector('#ff10-view-materials .ff10-material').click()")
          time.sleep(.2)
          assert evaluate("document.querySelector('#ff10-sheet-backdrop').classList.contains('is-open')")
          assert evaluate("!!document.querySelector('.ff101-material-sheet')")
          assert evaluate("!!document.querySelector('#ff101-basic')")
          assert evaluate("document.querySelectorAll('#ff101-basic .ff101-score').length===4")
          assert evaluate("document.querySelector('#ff101-technical').hasAttribute('hidden')")
          assert evaluate("document.querySelector('[data-ff101-toggle]').getAttribute('aria-expanded')==='false'")

          evaluate("document.querySelector('[data-ff101-toggle]').click()")
          time.sleep(.15)
          assert evaluate("!document.querySelector('#ff101-technical').hasAttribute('hidden')")
          assert evaluate("document.querySelector('[data-ff101-toggle]').getAttribute('aria-expanded')==='true'")
          assert evaluate("document.querySelectorAll('#ff101-technical .ff101-tech-item').length>=6")
          assert evaluate("document.querySelectorAll('#ff101-technical .ff101-advice-grid article').length===2")
          assert evaluate("!!document.querySelector('#ff101-technical .ff101-problems')")

          print('IPHONE_V101_MATERIAL_DETAILS_OK')
          ws.close()
          PY

          kill $CHROME_PID || true
          trap - EXIT
          docker inspect filament-finder-test --format '{{.State.Status}} {{.State.Health.Status}}'
          docker logs filament-finder-test
