name: Filament Finder image

on:
  push:
    branches:
      - master
      - filament-finder-10.2-material-accordions
    paths:
      - 'ilsamm-filament-finder/**'
      - '.github/workflows/filament-finder-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate 10.2 source syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check ilsamm-filament-finder/ui-v10/app.js
          node --check ilsamm-filament-finder/ui-v101/material-details.js
          node --check ilsamm-filament-finder/ui-v102/material-accordions.js
          node --check ilsamm-filament-finder/ui-v102/price-sources.js
          python -m py_compile ilsamm-filament-finder/runtime/build_runtime.py
          python -m py_compile ilsamm-filament-finder/runtime/patch_runtime_v102.py
          grep -q '.ff102-accordion' ilsamm-filament-finder/ui-v102/material-accordions.css
          grep -q '.ff102-price-sources' ilsamm-filament-finder/ui-v102/price-sources.css
          grep -q "const VERSION='10.2.0'" ilsamm-filament-finder/ui-v102/material-accordions.js
          grep -q 'renderTransparentMarket' ilsamm-filament-finder/ui-v102/price-sources.js

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push 10.2.0
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ilsamm-filament-finder/runtime/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ilsamm/filament-finder:10.2.0
            ghcr.io/ilsamm/filament-finder:latest
          provenance: false

      - name: Smoke, Bambu live-price and iPhone UI test
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io || true
          docker pull ghcr.io/ilsamm/filament-finder:10.2.0
          docker run -d --name filament-finder-test -p 18765:8765 ghcr.io/ilsamm/filament-finder:10.2.0
          trap 'docker logs filament-finder-test || true' EXIT
          for i in $(seq 1 30); do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18765/api/health', timeout=2).read()"; then break; fi
            sleep 1
          done

          python - <<'PY'
          import json, time, urllib.parse, urllib.request
          BASE='http://127.0.0.1:18765'
          def get(path, timeout=10):
              with urllib.request.urlopen(BASE+path, timeout=timeout) as r:
                  assert r.status == 200, r.status
                  return json.load(r)

          health=get('/api/health')
          assert health['ok'] is True
          assert health['version']=='10.2.0', health
          assert health['materials']==67, health
          assert health['brands']==18, health
          assert health['sources']>=11, health

          # This is the regression test requested for the official Bambu source.
          bambu=get('/api/catalog?material=PLA&brand=Bambu%20Lab&qty=1&refresh=1&source=bambu', timeout=30)
          assert len(bambu['sources'])==1, bambu['sources']
          bs=bambu['sources'][0]
          assert bs['id']=='bambu', bs
          assert bs['ok'] is True, bs
          assert bs['results']>0, bs
          assert len(bambu['offers'])>0, bambu
          prices=[float(o['price']) for o in bambu['offers'] if o.get('price') is not None]
          assert prices and min(prices)>=2 and max(prices)<=500, prices[:20]
          assert any((o.get('store')=='Bambu Lab EU' and o.get('brand')=='Bambu Lab') for o in bambu['offers']), bambu['offers'][:3]
          assert any('eu.store.bambulab.com' in str(o.get('url','')) for o in bambu['offers']), bambu['offers'][:3]
          print('BAMBU_EU_OK',{'offers':len(bambu['offers']),'min_price':min(prices),'max_price':max(prices),'ms':bs.get('ms')})

          started=time.time()
          live=get('/api/catalog?material=PLA&brand=all&qty=1&refresh=1', timeout=30)
          elapsed=time.time()-started
          assert len(live['offers'])>0, live
          assert len(live['sources'])>=11, live['sources']
          assert any(s.get('id')=='bambu' and s.get('results',0)>0 for s in live['sources']), live['sources']
          assert sum(1 for s in live['sources'] if s.get('ok'))>=2, live['sources']
          assert elapsed<25, elapsed
          print('ALL_SOURCES_OK', {
              'offers':len(live['offers']),
              'sources_ok':sum(1 for s in live['sources'] if s.get('ok')),
              'sources_with_results':sum(1 for s in live['sources'] if s.get('results',0)>0),
              'by_source':{s['id']:s.get('results',0) for s in live['sources']},
              'elapsed_s':round(elapsed,2)
          })
          PY

          command -v google-chrome >/dev/null
          python -m pip install --quiet websocket-client
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --remote-debugging-port=9222 --remote-debugging-address=127.0.0.1 --remote-allow-origins=* \
            --user-data-dir=/tmp/ff-chrome \
            http://127.0.0.1:18765 >/tmp/ff-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill $CHROME_PID 2>/dev/null || true; docker logs filament-finder-test || true' EXIT

          python - <<'PY'
          import json, time, urllib.request
          from websocket import create_connection

          deadline=time.time()+15
          targets=[]
          while time.time()<deadline:
              try:
                  targets=json.load(urllib.request.urlopen('http://127.0.0.1:9222/json',timeout=2))
                  targets=[t for t in targets if t.get('type')=='page']
                  if targets: break
              except Exception:
                  pass
              time.sleep(.25)
          assert targets, 'Chrome DevTools page target not found'
          ws=create_connection(targets[0]['webSocketDebuggerUrl'],timeout=15)
          counter=0

          def command(method, params=None):
              global counter
              counter+=1
              ws.send(json.dumps({'id':counter,'method':method,'params':params or {}}))
              while True:
                  msg=json.loads(ws.recv())
                  if msg.get('id')==counter:
                      if 'error' in msg: raise AssertionError(msg['error'])
                      return msg.get('result',{})

          def evaluate(expr):
              global counter
              counter+=1
              ws.send(json.dumps({'id':counter,'method':'Runtime.evaluate','params':{'expression':expr,'returnByValue':True,'awaitPromise':True}}))
              while True:
                  msg=json.loads(ws.recv())
                  if msg.get('id')==counter:
                      if 'exceptionDetails' in msg.get('result',{}): raise AssertionError(msg['result']['exceptionDetails'])
                      return msg['result']['result'].get('value')

          command('Emulation.setDeviceMetricsOverride',{
              'width':390,'height':844,'deviceScaleFactor':3,'mobile':True,
              'screenWidth':390,'screenHeight':844
          })
          command('Emulation.setTouchEmulationEnabled',{'enabled':True,'maxTouchPoints':5})
          command('Page.reload',{'ignoreCache':True})

          deadline=time.time()+12
          while time.time()<deadline and not evaluate("document.readyState==='complete' && !!document.querySelector('#ff10-app .ff10-nav')"):
              time.sleep(.2)

          checks={
            'viewport_width': "innerWidth===390",
            'version': "window.FILAMENT_FINDER_VERSION==='10.2.0'",
            'new_app_mounted': "!!document.querySelector('#ff10-app') && document.body.classList.contains('ff10-mounted')",
            'legacy_hidden': "getComputedStyle(document.querySelector('#ff10-legacy')).display==='none'",
            'no_page_horizontal_overflow': "document.documentElement.scrollWidth<=innerWidth+2",
            'nav_compact': "document.querySelector('.ff10-nav').getBoundingClientRect().height<=72",
            'material_cards': "document.querySelectorAll('#ff10-view-materials .ff10-material').length>=60",
            'price_controls': "document.querySelectorAll('#ff10-price-material option').length>=20",
          }
          for name,expr in checks.items():
              ok=evaluate(expr); print(name,ok); assert ok,name

          # Material sheet: important data first, then five collapsible sections.
          evaluate("document.querySelector('.ff10-nav [data-nav=\"materials\"]').click()")
          time.sleep(.2)
          evaluate("document.querySelector('#ff10-view-materials .ff10-material').click()")
          time.sleep(.25)
          assert evaluate("!!document.querySelector('.ff101-material-sheet')")
          assert evaluate("document.querySelectorAll('#ff101-basic .ff101-score').length===4")
          assert evaluate("document.querySelector('#ff101-technical').hasAttribute('hidden')")
          evaluate("document.querySelector('[data-ff101-toggle]').click()")
          time.sleep(.25)
          assert evaluate("!document.querySelector('#ff101-technical').hasAttribute('hidden')")
          assert evaluate("document.querySelectorAll('#ff101-technical .ff102-keyfact').length===4")
          assert evaluate("document.querySelectorAll('#ff101-technical .ff102-accordion').length===5")
          labels=evaluate("[...document.querySelectorAll('#ff101-technical .ff102-accordion summary b')].map(x=>x.textContent).join('|')")
          assert labels=='Stampa|Asciugatura|Compatibilità|Proprietà|Problemi comuni', labels
          assert evaluate("document.querySelector('[data-ff102-section=\"stampa\"]').open===true")
          evaluate("document.querySelector('[data-ff102-section=\"stampa\"] summary').click()")
          time.sleep(.1)
          assert evaluate("document.querySelector('[data-ff102-section=\"stampa\"]').open===false")
          evaluate("document.querySelector('[data-ff102-section=\"asciugatura\"] summary').click()")
          time.sleep(.1)
          assert evaluate("document.querySelector('[data-ff102-section=\"asciugatura\"]').open===true")

          # Close material sheet and validate price-source transparency UI.
          evaluate("document.querySelector('[data-sheet-close]').click()")
          evaluate("document.querySelector('.ff10-nav [data-nav=\"prices\"]').click()")
          time.sleep(.2)
          evaluate("fetch('/api/catalog?material=PLA&brand=all&qty=1&refresh=0').then(r=>r.json())")
          deadline=time.time()+12
          while time.time()<deadline and not evaluate("!!document.querySelector('#ff10-market-results .ff102-price-sources')"):
              time.sleep(.2)
          assert evaluate("document.querySelectorAll('.ff102-source').length>=11")
          assert evaluate("!!document.querySelector('.ff102-source[data-source-id=\"bambu\"]')")
          assert evaluate("document.querySelector('.ff102-source[data-source-id=\"bambu\"]').classList.contains('is-ok')")
          assert evaluate("document.querySelectorAll('.ff102-store-card').length>=2")
          assert evaluate("document.querySelectorAll('.ff102-store-group').length>=2")
          assert evaluate("document.documentElement.scrollWidth<=innerWidth+2")

          print('IPHONE_V102_ACCORDIONS_AND_PRICE_SOURCES_OK')
          ws.close()
          PY

          kill $CHROME_PID || true
          trap - EXIT
          docker inspect filament-finder-test --format '{{.State.Status}} {{.State.Health.Status}}'
          docker logs filament-finder-test
