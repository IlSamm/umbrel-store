name: Filament Finder QA and image

on:
  pull_request:
    paths:
      - 'ilsamm-filament-finder/**'
      - '.github/workflows/filament-finder-image.yml'
      - '.dockerignore'
  push:
    branches: [master]
    paths:
      - 'ilsamm-filament-finder/**'
      - '.github/workflows/filament-finder-image.yml'
      - '.dockerignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: filament-finder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ilsamm-filament-finder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ilsamm-filament-finder/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run test:backend
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - name: Store browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filament-finder-browser-evidence
          path: |
            ilsamm-filament-finder/playwright-report
            ilsamm-filament-finder/test-results
          retention-days: 14

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ilsamm-filament-finder/runtime/Dockerfile
          load: true
          tags: filament-finder:qa
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify container and persistent volume
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name filament-finder-qa -p 18765:8765 -v ff-qa-data:/data filament-finder:qa
          trap 'docker logs filament-finder-qa; docker rm -f filament-finder-qa' EXIT
          python ilsamm-filament-finder/tests/container_smoke.py http://127.0.0.1:18765
          docker restart filament-finder-qa
          python ilsamm-filament-finder/tests/container_smoke.py http://127.0.0.1:18765 --verify-persistence
      - name: Live Bambu variants release gate
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: python ilsamm-filament-finder/tests/live_bambu.py
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build both Umbrel architectures and publish only from master
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ilsamm-filament-finder/runtime/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/ilsamm/filament-finder:11.0.0
            ghcr.io/ilsamm/filament-finder:latest
          provenance: false
          cache-from: type=gha
