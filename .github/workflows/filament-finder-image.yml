name: Filament Finder image

on:
  push:
    branches:
      - master
      - filament-finder-10.3-marketplace
    paths:
      - 'ilsamm-filament-finder/**'
      - '.github/workflows/filament-finder-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate 10.3 source syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check ilsamm-filament-finder/ui-v10/app.js
          node --check ilsamm-filament-finder/ui-v101/material-details.js
          node --check ilsamm-filament-finder/ui-v102/material-accordions.js
          node --check ilsamm-filament-finder/ui-v102/price-sources.js
          python -m py_compile ilsamm-filament-finder/runtime/build_runtime.py
          python -m py_compile ilsamm-filament-finder/runtime/patch_runtime_v102.py
          grep -q '.ff103-overview' ilsamm-filament-finder/ui-v102/price-sources.css
          grep -q '.ff103-offer-card' ilsamm-filament-finder/ui-v102/price-sources.css
          grep -q "const VERSION='10.3.0'" ilsamm-filament-finder/ui-v102/price-sources.js
          grep -q 'FF103_RENDER_MARKETPLACE' ilsamm-filament-finder/ui-v102/price-sources.js

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push 10.3.0
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ilsamm-filament-finder/runtime/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ilsamm/filament-finder:10.3.0
            ghcr.io/ilsamm/filament-finder:latest
          provenance: false

      - name: Smoke, live marketplace and iPhone UI test
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io || true
          docker pull ghcr.io/ilsamm/filament-finder:10.3.0
          docker run -d --name filament-finder-test -p 18765:8765 ghcr.io/ilsamm/filament-finder:10.3.0
          trap 'docker logs filament-finder-test || true' EXIT
          for i in $(seq 1 30); do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18765/api/health', timeout=2).read()"; then break; fi
            sleep 1
          done

          python - <<'PY'
          import json, time, urllib.request
          BASE='http://127.0.0.1:18765'
          def get(path, timeout=10):
              with urllib.request.urlopen(BASE+path, timeout=timeout) as r:
                  assert r.status == 200, r.status
                  return json.load(r)
          health=get('/api/health')
          assert health['ok'] is True
          assert health['version']=='10.3.0', health
          assert health['materials']==67, health
          assert health['brands']==18, health
          assert health['sources']>=11, health

          bambu=get('/api/catalog?material=PLA&brand=Bambu%20Lab&qty=1&refresh=1&source=bambu', timeout=30)
          bs=bambu['sources'][0]
          assert bs['id']=='bambu' and bs['ok'] is True and bs['results']>0, bs
          assert len(bambu['offers'])>0
          assert any(o.get('store')=='Bambu Lab EU' for o in bambu['offers'])
          assert any('eu.store.bambulab.com' in str(o.get('url','')) for o in bambu['offers'])
          print('BAMBU_EU_OK', {'offers':len(bambu['offers']),'ms':bs.get('ms')})

          started=time.time()
          live=get('/api/catalog?material=PLA&brand=all&qty=1&refresh=1', timeout=30)
          elapsed=time.time()-started
          result_sources=[s for s in live['sources'] if s.get('results',0)>0]
          assert len(live['offers'])>=20
          assert len(live['sources'])>=11
          assert any(s.get('id')=='bambu' and s.get('results',0)>0 for s in live['sources'])
          assert len(result_sources)>=3
          assert elapsed<25, elapsed
          print('ALL_SOURCES_OK', {'offers':len(live['offers']),'sources_with_results':len(result_sources),'by_source':{s['id']:s.get('results',0) for s in live['sources']},'elapsed_s':round(elapsed,2)})
          PY

          command -v google-chrome >/dev/null
          python -m pip install --quiet websocket-client
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --remote-debugging-port=9222 --remote-debugging-address=127.0.0.1 --remote-allow-origins=* \
            --user-data-dir=/tmp/ff-chrome \
            http://127.0.0.1:18765 >/tmp/ff-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill $CHROME_PID 2>/dev/null || true; docker logs filament-finder-test || true' EXIT

          python - <<'PY'
          import json, time, urllib.request
          from websocket import create_connection

          deadline=time.time()+15
          targets=[]
          while time.time()<deadline:
              try:
                  targets=json.load(urllib.request.urlopen('http://127.0.0.1:9222/json',timeout=2))
                  targets=[t for t in targets if t.get('type')=='page']
                  if targets: break
              except Exception: pass
              time.sleep(.25)
          assert targets, 'Chrome DevTools page target not found'
          ws=create_connection(targets[0]['webSocketDebuggerUrl'],timeout=20)
          counter=0
          def command(method, params=None):
              global counter
              counter+=1
              ws.send(json.dumps({'id':counter,'method':method,'params':params or {}}))
              while True:
                  msg=json.loads(ws.recv())
                  if msg.get('id')==counter:
                      if 'error' in msg: raise AssertionError(msg['error'])
                      return msg.get('result',{})
          def evaluate(expr):
              global counter
              counter+=1
              ws.send(json.dumps({'id':counter,'method':'Runtime.evaluate','params':{'expression':expr,'returnByValue':True,'awaitPromise':True}}))
              while True:
                  msg=json.loads(ws.recv())
                  if msg.get('id')==counter:
                      if 'exceptionDetails' in msg.get('result',{}): raise AssertionError(msg['result']['exceptionDetails'])
                      return msg['result']['result'].get('value')

          command('Emulation.setDeviceMetricsOverride',{'width':390,'height':844,'deviceScaleFactor':3,'mobile':True,'screenWidth':390,'screenHeight':844})
          command('Emulation.setTouchEmulationEnabled',{'enabled':True,'maxTouchPoints':5})
          command('Page.reload',{'ignoreCache':True})
          deadline=time.time()+12
          while time.time()<deadline and not evaluate("document.readyState==='complete' && !!document.querySelector('#ff10-app .ff10-nav')"):
              time.sleep(.2)

          checks={
            'viewport_width': "innerWidth===390",
            'market_script': "window.FF103_MARKETPLACE_VERSION==='10.3.0' && typeof window.FF103_RENDER_MARKETPLACE==='function'",
            'new_app_mounted': "!!document.querySelector('#ff10-app') && document.body.classList.contains('ff10-mounted')",
            'no_page_horizontal_overflow': "document.documentElement.scrollWidth<=innerWidth+2",
            'material_cards': "document.querySelectorAll('#ff10-view-materials .ff10-material').length>=60",
          }
          for name,expr in checks.items():
              ok=evaluate(expr); print(name,ok); assert ok,name

          # Technical sheet regression.
          evaluate("document.querySelector('.ff10-nav [data-nav=\"materials\"]').click()")
          time.sleep(.15)
          evaluate("document.querySelector('#ff10-view-materials .ff10-material').click()")
          time.sleep(.2)
          assert evaluate("!!document.querySelector('.ff101-material-sheet')")
          evaluate("document.querySelector('[data-ff101-toggle]').click()")
          time.sleep(.15)
          assert evaluate("document.querySelectorAll('#ff101-technical .ff102-accordion').length===5")
          evaluate("document.querySelector('[data-sheet-close]').click()")

          # Test the actual user flow: open Prices, choose PLA, press Cerca prezzi.
          evaluate("document.querySelector('.ff10-nav [data-nav=\"prices\"]').click()")
          time.sleep(.2)
          assert evaluate("!!document.querySelector('[data-market-run]')")
          evaluate("(()=>{const s=document.querySelector('#ff10-price-material');if(s){const pla=[...s.options].find(o=>String(o.value).toUpperCase()==='PLA'||/^PLA$/i.test(o.textContent.trim()));if(pla){s.value=pla.value;s.dispatchEvent(new Event('change',{bubbles:true}));}}document.querySelector('[data-market-run]').click();return true;})()")
          deadline=time.time()+20
          while time.time()<deadline and not evaluate("!!document.querySelector('#ff10-market-results .ff103-overview')"):
              time.sleep(.25)
          if not evaluate("!!document.querySelector('#ff10-market-results .ff103-overview')"):
              debug=evaluate("JSON.stringify({marker:window.FF103_MARKETPLACE_VERSION,root:document.querySelector('#ff10-market-results')?.innerHTML?.slice(0,300),status:document.querySelector('.ff10-market-status')?.textContent,btn:!!document.querySelector('[data-market-run]')})")
              raise AssertionError('marketplace did not render after real button click: '+str(debug))

          market_checks={
            'marketplace_version': "document.querySelector('#ff10-market-results').dataset.ffMarketplace==='103'",
            'three_picks': "document.querySelectorAll('.ff103-pick').length===3",
            'bambu_pick': "[...document.querySelectorAll('.ff103-pick-copy>span')].some(x=>x.textContent.includes('Bambu ufficiale'))",
            'source_rail': "document.querySelectorAll('.ff103-source-chip').length>=11",
            'bambu_source': "!!document.querySelector('.ff103-source-chip[data-source-id=\"bambu\"].is-ok')",
            'filter_panel': "!!document.querySelector('.ff103-filter-panel')",
            'sort_control': "!!document.querySelector('[data-ff103-sort]')",
            'store_control': "!!document.querySelector('[data-ff103-store]')",
            'brand_control': "!!document.querySelector('[data-ff103-brand]')",
            'color_control': "!!document.querySelector('[data-ff103-color]')",
            'offer_cards': "document.querySelectorAll('.ff103-offer-card').length>0",
            'shop_links': "document.querySelectorAll('.ff103-shop-button').length>0",
            'diagnostics_collapsed': "!!document.querySelector('.ff103-diagnostics:not([open])')",
            'no_market_overflow': "document.documentElement.scrollWidth<=innerWidth+2",
          }
          for name,expr in market_checks.items():
              ok=evaluate(expr); print(name,ok); assert ok,name

          evaluate("document.querySelector('.ff103-source-chip[data-source-id=\"bambu\"]').click()")
          time.sleep(.15)
          assert evaluate("document.querySelector('[data-ff103-store]').value==='bambu'")
          assert evaluate("[...document.querySelectorAll('.ff103-offer-card')].every(x=>x.dataset.store==='bambu')")
          evaluate("document.querySelector('[data-ff103-reset]').click()")
          time.sleep(.15)
          assert evaluate("document.querySelector('[data-ff103-store]').value==='all'")
          evaluate("(()=>{const s=document.querySelector('[data-ff103-sort]');s.value='perkg';s.dispatchEvent(new Event('change',{bubbles:true}));return true})()")
          time.sleep(.15)
          assert evaluate("document.querySelector('[data-ff103-sort]').value==='perkg'")
          assert evaluate("document.querySelectorAll('.ff103-offer-card').length>0")
          assert evaluate("document.documentElement.scrollWidth<=innerWidth+2")
          print('IPHONE_V103_MARKETPLACE_OK')
          ws.close()
          PY

          kill $CHROME_PID || true
          trap - EXIT
          docker inspect filament-finder-test --format '{{.State.Status}} {{.State.Health.Status}}'
          docker logs filament-finder-test
