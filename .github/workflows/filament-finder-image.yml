name: Filament Finder image

on:
  push:
    branches:
      - master
      - filament-finder-v9
      - filament-finder-mobile-rebuild
    paths:
      - 'ilsamm-filament-finder/**'
      - '.github/workflows/filament-finder-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ilsamm-filament-finder/runtime/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ilsamm/filament-finder:9.1.0-dev
          provenance: false

      - name: Runtime audit
        shell: bash
        run: |
          set -euo pipefail
          docker pull ghcr.io/ilsamm/filament-finder:9.1.0-dev
          docker run -d --name filament-finder-audit -p 18765:8765 ghcr.io/ilsamm/filament-finder:9.1.0-dev
          trap 'docker logs filament-finder-audit || true' EXIT
          for i in $(seq 1 30); do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18765/api/health', timeout=2).read()"; then break; fi
            sleep 1
          done
          echo '===== INDEX.HTML ====='
          docker exec filament-finder-audit cat /app/index.html
          echo '===== CSS SELECTOR AUDIT ====='
          docker exec filament-finder-audit sh -c "grep -nE 'bottom|nav|price|market|material|advisor|sheet|modal|chip|card|toolbar|header' /app/v9.css | head -n 500"
          echo '===== APP.JS UI AUDIT ====='
          docker exec filament-finder-audit sh -c "grep -nE 'render|searchPricesBtn|price|market|material|advisor|sheet|modal|chip|source' /app/app.js | head -n 700"
          echo '===== V7.JS UI AUDIT ====='
          docker exec filament-finder-audit sh -c "grep -nE 'render|price|market|material|advisor|sheet|modal|chip|bottom' /app/v7.js | head -n 500"
          echo '===== V9.JS UI AUDIT ====='
          docker exec filament-finder-audit cat /app/v9.js
          trap - EXIT
          docker logs filament-finder-audit
