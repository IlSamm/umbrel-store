name: Filament Finder image

on:
  push:
    branches:
      - filament-finder-v8.0.2-image
    paths:
      - 'ilsamm-filament-finder/**'
      - '.github/workflows/filament-finder-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ilsamm-filament-finder/runtime/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ilsamm/filament-finder:8.0.2
            ghcr.io/ilsamm/filament-finder:latest
          provenance: false

      - name: Smoke-test amd64 image
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name filament-finder-test -p 18765:8765 ghcr.io/ilsamm/filament-finder:8.0.2
          trap 'docker logs filament-finder-test || true' EXIT
          for i in $(seq 1 30); do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18765/api/sources', timeout=2).read()"; then
              docker inspect filament-finder-test --format '{{.State.Status}} {{.State.Health.Status}}'
              trap - EXIT
              docker logs filament-finder-test
              exit 0
            fi
            sleep 2
          done
          exit 1
