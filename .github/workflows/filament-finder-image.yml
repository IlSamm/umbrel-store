name: Filament Finder image

on:
  push:
    branches:
      - master
      - filament-finder-10.7-source-diagnostics
      - filament-finder-10.7-bambu-required-tests
    paths:
      - 'ilsamm-filament-finder/**'
      - '.github/workflows/filament-finder-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: filament-finder-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate 10.7 source syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check ilsamm-filament-finder/ui-v102/marketplace-capture.js
          node --check ilsamm-filament-finder/ui-v104/price-quality.js
          node --check ilsamm-filament-finder/ui-v105/deal-engine.js
          node --check ilsamm-filament-finder/ui-v106/source-status.js
          node --check ilsamm-filament-finder/ui-v107/source-diagnostics.js
          python -m py_compile ilsamm-filament-finder/runtime/build_runtime.py
          python -m py_compile ilsamm-filament-finder/runtime/patch_runtime_v106.py
          python -m py_compile ilsamm-filament-finder/runtime/patch_runtime_v107.py
          grep -q "const VERSION='10.7.0'" ilsamm-filament-finder/ui-v107/source-diagnostics.js
          grep -q 'FF107_RETRY_SOURCE' ilsamm-filament-finder/ui-v107/source-diagnostics.js
          grep -q 'URL chiamato' ilsamm-filament-finder/ui-v107/source-diagnostics.js
          grep -q 'Riprova fonte' ilsamm-filament-finder/ui-v107/source-diagnostics.js
          grep -q '.ff107-diagnostic-grid' ilsamm-filament-finder/ui-v107/source-diagnostics.css
          grep -q 'version: "10.7.0"' ilsamm-filament-finder/umbrel-app.yml
          grep -q 'filament-finder:10.7.0' ilsamm-filament-finder/docker-compose.yml

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push 10.7.0
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ilsamm-filament-finder/runtime/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ilsamm/filament-finder:10.7.0
            ghcr.io/ilsamm/filament-finder:latest
          provenance: false

      - name: Smoke diagnostics, Bambu gate and retry test
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io || true
          docker pull ghcr.io/ilsamm/filament-finder:10.7.0
          docker run -d --name filament-finder-test -p 18765:8765 ghcr.io/ilsamm/filament-finder:10.7.0
          trap 'docker logs filament-finder-test || true' EXIT

          for i in $(seq 1 30); do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18765/api/health', timeout=2).read()"; then break; fi
            sleep 1
          done

          python - <<'PY'
          import json, re, urllib.parse, urllib.request
          BASE='http://127.0.0.1:18765'
          def get(path, timeout=35):
              with urllib.request.urlopen(BASE+path, timeout=timeout) as r:
                  assert r.status==200, r.status
                  return json.load(r)

          health=get('/api/health',10)
          assert health['version']=='10.7.0', health

          live=get('/api/catalog?material=PLA&brand=all&qty=10&refresh=1')
          assert len(live.get('sources',[]))>=11, live
          assert len(live.get('offers',[]))>=20, len(live.get('offers',[]))
          active=[s for s in live['sources'] if int(s.get('results') or 0)>0]
          assert active, live['sources']
          assert any(s.get('request_url') or s.get('request_trace') for s in active), active[:3]
          sid=str(active[0].get('id'))
          one=get('/api/catalog?material=PLA&brand=all&qty=10&refresh=1&source='+sid)
          ids={str(s.get('id')) for s in one.get('sources',[])}
          assert sid in ids, (sid,ids)
          print('BACKEND_107_DIAGNOSTICS_OK', {'source':sid,'sources':len(live['sources'])})

          # Mandatory live Bambu Lab gate. This is intentionally strict: if Bambu
          # changes its storefront/backend and any core family stops exposing real
          # purchasable variants, the build must fail instead of shipping silently.
          cases=[
              ('PLA Basic','PLA BASIC'),
              ('PLA Matte','PLA MATTE'),
              ('PETG HF','PETG HF'),
          ]
          refill_rx=re.compile(r'\b(refill|ricarica|without\s+spool|senza\s+bobina)\b',re.I)
          spool_rx=re.compile(r'\b(with\s+spool|spool|bobina)\b',re.I)

          def offer_text(o):
              return ' '.join(str(o.get(k) or '') for k in ('product','title','name','variant','format','size','note'))

          for material,label in cases:
              path='/api/catalog?'+urllib.parse.urlencode({
                  'material':material,
                  'brand':'all',
                  'qty':'1',
                  'refresh':'1',
                  'source':'bambu',
              })
              data=get(path, timeout=35)
              sources=[s for s in data.get('sources',[]) if str(s.get('id'))=='bambu']
              assert len(sources)==1, f'{label}: expected isolated Bambu source, got {data.get("sources")}'
              source=sources[0]
              assert source.get('ok') is True, f'{label}: Bambu source failed: {source}'
              assert int(source.get('results') or 0)>0, f'{label}: Bambu returned zero results: {source}'

              offers=[o for o in data.get('offers',[]) if str(o.get('source_id'))=='bambu']
              assert offers, f'{label}: no Bambu offers returned'
              assert len(offers)==int(source.get('results') or len(offers)), (
                  f'{label}: source result count mismatch: source={source.get("results")} offers={len(offers)}'
              )

              bad_price=[o for o in offers if not isinstance(o.get('price'),(int,float)) or isinstance(o.get('price'),bool) or float(o.get('price') or 0)<=0]
              assert not bad_price, f'{label}: invalid/missing prices: {bad_price[:3]}'

              missing_availability=[o for o in offers if 'available' not in o or not isinstance(o.get('available'),bool)]
              assert not missing_availability, f'{label}: availability must be explicit boolean: {missing_availability[:3]}'
              assert any(o.get('available') is True for o in offers), f'{label}: no purchasable Bambu variant is available'

              texts=[offer_text(o) for o in offers]
              refill=[o for o,t in zip(offers,texts) if refill_rx.search(t)]
              spool=[o for o,t in zip(offers,texts) if spool_rx.search(t) and not refill_rx.search(t)]
              assert refill, f'{label}: no Refill variant found; variants={[o.get("variant") for o in offers[:12]]}'
              assert spool, f'{label}: no With Spool/bobina variant found; variants={[o.get("variant") for o in offers[:12]]}'
              assert any(o.get('available') is True and float(o.get('price') or 0)>0 for o in refill), f'{label}: no available priced Refill variant'
              assert any(o.get('available') is True and float(o.get('price') or 0)>0 for o in spool), f'{label}: no available priced spool variant'

              print('BAMBU_REQUIRED_FAMILY_OK', {
                  'family':label,
                  'offers':len(offers),
                  'refill':len(refill),
                  'spool':len(spool),
                  'available':sum(o.get('available') is True for o in offers),
                  'price_min':min(float(o['price']) for o in offers),
                  'http_status':source.get('http_status'),
                  'ms':source.get('ms'),
              })

          print('BAMBU_REQUIRED_LIVE_GATE_OK', [label for _,label in cases])
          PY

          command -v google-chrome >/dev/null
          python -m pip install --quiet websocket-client
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --remote-debugging-port=9222 --remote-debugging-address=127.0.0.1 --remote-allow-origins=* \
            --user-data-dir=/tmp/ff-chrome http://127.0.0.1:18765 >/tmp/ff-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill $CHROME_PID 2>/dev/null || true; docker logs filament-finder-test || true' EXIT

          python - <<'PY'
          import json,time,urllib.request
          from websocket import create_connection
          deadline=time.time()+15
          targets=[]
          while time.time()<deadline:
              try:
                  targets=[t for t in json.load(urllib.request.urlopen('http://127.0.0.1:9222/json',timeout=2)) if t.get('type')=='page']
                  if targets: break
              except Exception: pass
              time.sleep(.25)
          assert targets
          ws=create_connection(targets[0]['webSocketDebuggerUrl'],timeout=20)
          counter=0
          def ev(expr):
              global counter
              counter+=1
              ws.send(json.dumps({'id':counter,'method':'Runtime.evaluate','params':{'expression':expr,'returnByValue':True,'awaitPromise':True}}))
              while True:
                  msg=json.loads(ws.recv())
                  if msg.get('id')==counter:
                      if 'exceptionDetails' in msg.get('result',{}): raise AssertionError(msg['result']['exceptionDetails'])
                      return msg['result']['result'].get('value')
          deadline=time.time()+12
          while time.time()<deadline and not ev("document.readyState==='complete' && !!document.querySelector('#ff10-app .ff10-nav')"):
              time.sleep(.2)
          assert ev("window.FF107_SOURCE_DIAGNOSTICS_VERSION==='10.7.0'")
          assert ev("typeof window.FF107_RETRY_SOURCE==='function'")
          ev("document.querySelector('.ff10-nav [data-nav=\"prices\"]').click()")
          deadline=time.time()+4
          while time.time()<deadline and not ev("!!document.querySelector('[data-market-run]')"):time.sleep(.1)
          ev("(()=>{const qty=document.querySelector('#ff10-price-qty');qty.value='10';qty.dispatchEvent(new Event('change',{bubbles:true}));document.querySelector('[data-market-run]').click();return true;})()")
          deadline=time.time()+32
          while time.time()<deadline and not ev("!!document.querySelector('.ff107-diagnostics-panel') && document.querySelectorAll('.ff107-card').length>=11"):
              time.sleep(.25)
          assert ev("document.querySelectorAll('.ff107-card').length===window.FF106_LAST_DATA.sources.length")
          assert ev("!!document.querySelector('.ff107-field.is-url')")
          assert ev("document.querySelector('.ff107-diagnostics-panel').textContent.includes('HTTP')")
          assert ev("document.querySelector('.ff107-diagnostics-panel').textContent.includes('Tempo fonte')")
          assert ev("document.documentElement.scrollWidth<=innerWidth+2")
          ev("window.FF106_LAST_DATA={sources:[{id:'broken',name:'Broken',ok:false,results:0,error_message:'HTTP 500'}],offers:[]};window.FF105_LAST_DATA=window.FF106_LAST_DATA")
          ev("document.body.appendChild(document.createElement('i'))")
          deadline=time.time()+2
          while time.time()<deadline and not ev("!!document.querySelector('[data-ff107-retry=\"broken\"]')"):time.sleep(.1)
          assert ev("document.querySelector('[data-ff107-retry=\"broken\"]')?.textContent.includes('Riprova fonte')")
          print('FILAMENT_FINDER_10_7_DIAGNOSTICS_UI_OK')
          ws.close()
          PY

          kill $CHROME_PID || true
          trap - EXIT
          docker inspect filament-finder-test --format '{{.State.Status}} {{.State.Health.Status}}'
