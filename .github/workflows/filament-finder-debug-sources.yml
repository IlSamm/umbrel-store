name: Filament Finder source diagnostics

on:
  push:
    branches:
      - filament-finder-10.2-material-accordions
    paths:
      - 'ilsamm-filament-finder/**'
      - '.github/workflows/filament-finder-debug-sources.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect runtime price parser anchors
        shell: bash
        run: |
          set -euo pipefail
          python ilsamm-filament-finder/runtime/build_runtime.py . /tmp/ff-runtime
          python - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/ff-runtime/server.py').read_text(encoding='utf-8').splitlines()
          for needle in ('def shopify_product_variants','def scrape_shopify','def _collect_source','def product_matches_material','def variant_material','def parse_weight'):
              for i,line in enumerate(lines):
                  if needle in line:
                      print('\n###',needle,'line',i+1)
                      for j in range(max(0,i-3),min(len(lines),i+95)):
                          print(f'{j+1:04d}: {lines[j]}')
                      break
          PY
