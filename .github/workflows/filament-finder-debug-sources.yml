name: Filament Finder source diagnostics

on:
  push:
    branches:
      - filament-finder-10.2-material-accordions
    paths:
      - 'ilsamm-filament-finder/**'
      - '.github/workflows/filament-finder-debug-sources.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Bambu localized catalogue and products
        shell: bash
        run: |
          set -euo pipefail
          python ilsamm-filament-finder/runtime/build_runtime.py . /tmp/ff-runtime
          python - <<'PY'
          import importlib.util, re, urllib.request
          spec=importlib.util.spec_from_file_location('ffserver','/tmp/ff-runtime/server.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          headers={'User-Agent':mod.UA,'Accept-Language':'it-IT,it;q=0.9,en;q=0.7','Accept':'text/html,*/*'}
          urls=[
            'https://eu.store.bambulab.com/it/collections/bambu-lab-3d-printer-filament',
            'https://eu.store.bambulab.com/en/collections/bambu-lab-3d-printer-filament',
            'https://eu.store.bambulab.com/en-ro/collections/bambu-lab-3d-printer-filament',
            'https://eu.store.bambulab.com/it/products/pla-basic-filament',
            'https://eu.store.bambulab.com/en/products/pla-basic-filament',
            'https://eu.store.bambulab.com/en-ro/products/pla-basic-filament',
          ]
          for url in urls:
            try:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=15) as r:
                body=r.read(4_500_000); text=body.decode(r.headers.get_content_charset() or 'utf-8','ignore'); low=text.lower()
                print('\nURL',url)
                print('STATUS',r.status,'FINAL',r.geturl(),'LEN',len(body),'EUR',text.count('€'),'PLA_BASIC',low.count('pla basic'))
                for pat in [r'href=["\']([^"\']*pla-basic[^"\']*)',r'"price"\s*:\s*"?([0-9][0-9.,]*)',r'€\s*([0-9]+(?:[.,][0-9]{2})?)',r'([0-9]+(?:[.,][0-9]{2})?)\s*EUR']:
                  vals=[]
                  for x in re.findall(pat,text,re.I):
                    if x not in vals: vals.append(x)
                  print('PAT',pat,'=>',vals[:20])
                idx=low.find('pla basic')
                if idx>=0: print('CTX',text[max(0,idx-700):idx+3500].replace('\n',' ')[:4200])
            except Exception as e:
              print('\nURL',url,'ERROR',type(e).__name__,str(e)[:600])
          PY
