  <script>
(function () {
  var root = document.documentElement;
  var body = document.body;
  var lastTouchEnd = 0;
  var KEYBOARD_THRESHOLD = 120;
  var stableViewportHeight = Math.max(window.innerHeight || 0, document.documentElement.clientHeight || 0);
  var lastNonKeyboardHeight = stableViewportHeight;
  var focusedEditable = null;

  function isIOSLike() {
    var ua = String(navigator.userAgent || '');
    return /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }

  function getStandaloneScreenHeight() {
    var standalone = window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    if (!standalone || !isIOSLike() || !window.screen) return 0;
    var screenHeight = Math.max(Number(window.screen.height) || 0, Number(window.screen.availHeight) || 0);
    return screenHeight > 320 && screenHeight < 1200 ? screenHeight : 0;
  }

  function isEditable(el) {
    if (!el) return false;
    var tag = String(el.tagName || '').toLowerCase();
    return tag === 'input' || tag === 'textarea' || tag === 'select' || !!el.isContentEditable;
  }

  function preventDefaultIfCancelable(event) {
    if (event && event.cancelable) event.preventDefault();
  }

  function resetWindowScroll() {
    window.scrollTo(0, 0);
    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;
  }

  function keepFocusedControlVisible() {
    var target = focusedEditable && document.contains(focusedEditable) ? focusedEditable : document.activeElement;
    if (!isEditable(target)) return;
    var vv = window.visualViewport;
    var visibleTop = vv ? Math.max(0, Math.round(vv.offsetTop || 0)) : 0;
    var visibleBottom = visibleTop + (vv ? Math.round(vv.height) : window.innerHeight);
    var margin = 22;
    var rect = target.getBoundingClientRect();
    var container = target.closest('.day-editor-scroll, .screen.active, .account-gate, .account-page-overlay, .vacation-manager-scroll, .dialog-panel');
    if (!container || typeof container.scrollTop !== 'number') return;
    if (rect.bottom > visibleBottom - margin) {
      container.scrollTop += rect.bottom - (visibleBottom - margin);
    } else if (rect.top < visibleTop + margin) {
      container.scrollTop -= (visibleTop + margin) - rect.top;
    }
  }

  function scheduleViewportFix() {
    applyViewportFix();
    window.requestAnimationFrame(applyViewportFix);
    window.setTimeout(applyViewportFix, 120);
    window.setTimeout(applyViewportFix, 320);
  }

  function applyViewportFix() {
    var vv = window.visualViewport;
    var baseHeight = Math.max(
      window.innerHeight || 0,
      document.documentElement.clientHeight || 0
    );
    var visualHeight = vv ? Math.round(vv.height) : baseHeight;
    var screenHeight = getStandaloneScreenHeight();
    var fullHeight = Math.max(baseHeight, visualHeight, screenHeight || 0);
    var typing = isEditable(document.activeElement);
    var bottomGap = 0;
    var keyboardOpen = false;
    if (vv) {
      var rawBottomGap = Math.max(0, Math.round((lastNonKeyboardHeight || stableViewportHeight || window.innerHeight) - vv.height));
      bottomGap = rawBottomGap > 8 ? rawBottomGap : 0;
      keyboardOpen = typing && rawBottomGap > KEYBOARD_THRESHOLD;
    }
    if (keyboardOpen) {
      stableViewportHeight = Math.max(stableViewportHeight || 0, lastNonKeyboardHeight || 0);
    } else {
      stableViewportHeight = Math.max(baseHeight, screenHeight || 0);
      lastNonKeyboardHeight = stableViewportHeight;
    }
    var layoutHeight = lastNonKeyboardHeight || stableViewportHeight || fullHeight;
    var keyboardInset = keyboardOpen ? Math.max(0, layoutHeight - visualHeight) : 0;
    root.style.setProperty('--app-vh', layoutHeight + 'px');
    root.style.setProperty('--real-app-vh', layoutHeight + 'px');
    root.style.setProperty('--visible-app-vh', visualHeight + 'px');
    root.style.setProperty('--keyboard-inset', Math.round(keyboardInset) + 'px');
    root.style.setProperty('--keyboard-offset-top', Math.round(vv ? vv.offsetTop || 0 : 0) + 'px');
    root.style.setProperty('--runtime-bottom-gap', Math.round(bottomGap) + 'px');
    if (body) body.classList.toggle('keyboard-open', keyboardOpen || typing);
    root.classList.toggle('keyboard-open', keyboardOpen || typing);
    resetWindowScroll();
    if (keyboardOpen) window.requestAnimationFrame(keepFocusedControlVisible);
  }

  scheduleViewportFix();

  window.addEventListener('resize', scheduleViewportFix, { passive: true });
  window.addEventListener('orientationchange', function () {
    stableViewportHeight = Math.max(window.innerHeight || 0, document.documentElement.clientHeight || 0);
    lastNonKeyboardHeight = stableViewportHeight;
    scheduleViewportFix();
    window.setTimeout(scheduleViewportFix, 320);
  }, { passive: true });
  window.addEventListener('pageshow', scheduleViewportFix, { passive: true });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) scheduleViewportFix();
  }, { passive: true });

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', scheduleViewportFix, { passive: true });
    window.visualViewport.addEventListener('scroll', scheduleViewportFix, { passive: true });
  }

  document.addEventListener('focusin', function (event) {
    if (isEditable(event.target)) focusedEditable = event.target;
    if (body && focusedEditable) body.classList.add('keyboard-open');
    if (focusedEditable) root.classList.add('keyboard-open');
    scheduleViewportFix();
    window.setTimeout(keepFocusedControlVisible, 180);
    window.setTimeout(keepFocusedControlVisible, 380);
  }, true);

  document.addEventListener('focusout', function () {
    window.setTimeout(function () {
      if (body && !isEditable(document.activeElement)) body.classList.remove('keyboard-open');
      if (!isEditable(document.activeElement)) {
        root.classList.remove('keyboard-open');
        focusedEditable = null;
      }
      scheduleViewportFix();
    }, 120);
  }, true);

  document.addEventListener('gesturestart', preventDefaultIfCancelable, { passive: false });
  document.addEventListener('gesturechange', preventDefaultIfCancelable, { passive: false });
  document.addEventListener('gestureend', preventDefaultIfCancelable, { passive: false });
  document.addEventListener('touchstart', function (event) {
    if (event.touches && event.touches.length > 1) preventDefaultIfCancelable(event);
  }, { passive: false });
  document.addEventListener('touchmove', function (event) {
    if (event.touches && event.touches.length > 1) preventDefaultIfCancelable(event);
  }, { passive: false });
  document.addEventListener('touchend', function (event) {
    var now = Date.now();
    if (now - lastTouchEnd < 320) preventDefaultIfCancelable(event);
    lastTouchEnd = now;
  }, { passive: false });
  window.addEventListener('wheel', function (event) {
    if (event.ctrlKey) preventDefaultIfCancelable(event);
  }, { passive: false });
  window.addEventListener('keydown', function (event) {
    var key = String(event.key || '');
    if ((event.ctrlKey || event.metaKey) && (key === '+' || key === '=' || key === '-' || key === '_' || key === '0')) {
      event.preventDefault();
    }
  }, { passive: false });
})();
</script>
