version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: ilsamm-gestore_server_1
      APP_PORT: 8080

  server:
    image: ilsammm/gestore:1.1.116
    restart: on-failure
    stop_grace_period: 1m
    environment:
      GESTORE_DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
