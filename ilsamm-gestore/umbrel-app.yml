manifestVersion: 1
id: ilsamm-gestore
name: GestOre
tagline: Tieni ore, turni e riposi con una UI elegante
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-gestore/icon.svg
category: files
version: "1.5.8"
port: 8080

description: >-
  GestOre e la tua app personale per gestire ore lavorate, straordinari,
  riposi, note e dati salvati in SQLite su umbrelOS, pensata per iPhone.

releaseNotes: >-
  GestOre 1.5.8 rinnova la barra di navigazione con un vetro piu profondo,
  un selettore fluido e centrato, icone uniformi ed etichette sempre
  leggibili. Il trascinamento segue il dito e cambia schermata soltanto
  al rilascio, senza modificare safe area o dati salvati.

