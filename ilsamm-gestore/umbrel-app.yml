manifestVersion: 1
id: ilsamm-gestore
name: GestOre
tagline: Tieni ore, turni e riposi con una UI elegante
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-gestore/icon.svg
category: files
version: "1.4.2"
port: 8080

description: >-
  GestOre e la tua app personale per gestire ore lavorate, straordinari,
  riposi, note e dati salvati in SQLite su umbrelOS, pensata per iPhone.

releaseNotes: >-
  GestOre 1.4.2 applica il limite mensile esclusivamente alle ore
  straordinarie. Le ore ordinarie restano sempre complete, mentre extra
  registrati, conteggiati ed esclusi vengono mostrati separatamente. I dati
  salvati con la versione precedente vengono migrati automaticamente.

