manifestVersion: 1
id: ilsamm-gestore
name: GestOre
tagline: Tieni ore, turni e riposi con una UI elegante
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-gestore/icon.svg
category: files
version: "1.8.17"
port: 8080

description: >-
  GestOre e la tua app personale per gestire ore lavorate, straordinari,
  riposi, note e dati salvati in SQLite su umbrelOS, pensata per iPhone.

releaseNotes: >-
  GestOre 1.8.17 prepara una build iPhone local-first senza cambiare il database
  self-hosted di Umbrel. Il salvataggio locale, i backup e le foto dei cedolini
  sono piu resilienti, la configurazione iniziale parte automaticamente sui nuovi
  archivi e privacy e controlli di rilascio sono stati rinforzati. Tutti i dati
  gia salvati restano invariati.

developer: IlSamm
