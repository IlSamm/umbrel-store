id: ilsamm-gestore
name: GestOre
tagline: Tieni ore, turni e riposi con una UI elegante
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-gestore/icon.svg
category: files
version: "1.6.0"
port: 8080

description: >-
  GestOre e la tua app personale per gestire ore lavorate, straordinari,
  riposi, note e dati salvati in SQLite su umbrelOS, pensata per iPhone.

releaseNotes: >-
  GestOre 1.6.0 rende l'app piu rapida e stabile, rinnova la navigazione
  con un vetro piu fluido e leggibile e aggiunge Home personalizzabile,
  centro attivita, confronto stipendio ed esportazione calendario. Le foto
  dei cedolini vengono ora caricate solo quando servono e salvate in modo
  efficiente nel database, senza modificare i dati esistenti.

