manifestVersion: 1
id: ilsamm-gestore
name: GestOre
tagline: Tieni ore, turni e riposi con una UI elegante
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-gestore/icon.svg
category: files
version: "1.8.16"
port: 8080

description: >-
  GestOre e la tua app personale per gestire ore lavorate, straordinari,
  riposi, note e dati salvati in SQLite su umbrelOS, pensata per iPhone.

releaseNotes: >-
  GestOre 1.8.16 rifinisce completamente il Centro mese. Il fondale ora riempie
  tutta la superficie dell'iPhone senza pareti nere, la card nella Home e piu
  ordinata e le percentuali sono centrate con precisione. Il cambio mese non
  ricrea piu la schermata: contenuti, posizione e comandi restano stabili con una
  transizione breve e fluida. Tutti i dati gia salvati restano invariati.

developer: IlSamm
