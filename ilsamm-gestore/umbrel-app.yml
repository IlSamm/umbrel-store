manifestVersion: 1
id: ilsamm-gestore
name: GestOre
tagline: Tieni ore, turni e riposi con una UI elegante
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-gestore/icon.svg
category: files
version: "1.8.12"
port: 8080

description: >-
  GestOre e la tua app personale per gestire ore lavorate, straordinari,
  riposi, note e dati salvati in SQLite su umbrelOS, pensata per iPhone.

releaseNotes: >-
  GestOre 1.8.12 ricalcola automaticamente la stima dello stipendio usando le ore
  di straordinario realmente registrate nel mese. Nei cedolini puoi ora indicare
  azienda, lordo e netto, ricordare l'azienda per i mesi successivi e modificarla
  quando serve. Archivio, PDF e dati esistenti restano compatibili.

developer: IlSamm
