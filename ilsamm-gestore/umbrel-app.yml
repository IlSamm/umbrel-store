manifestVersion: 1
id: ilsamm-gestore
name: GestOre
tagline: Tieni ore, turni e riposi con una UI elegante
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-gestore/icon.svg
category: files
version: "1.8.15"
port: 8080

description: >-
  GestOre e la tua app personale per gestire ore lavorate, straordinari,
  riposi, note e dati salvati in SQLite su umbrelOS, pensata per iPhone.

releaseNotes: >-
  GestOre 1.8.15 introduce Centro mese, un riepilogo intelligente che controlla
  giornate mancanti, cedolino, sincronizzazione e report senza rendere mai
  obbligatori sabato e domenica. La nuova vista confronta anche la stima dello
  stipendio con il netto reale e collega direttamente statistiche e PDF mensile.
  Migliorati inoltre i feedback di salvataggio e le conferme accessibili.
  Tutti i dati gia salvati restano invariati e compatibili.

