manifestVersion: 1
id: ilsamm-gestore
name: GestOre
tagline: Tieni ore, turni e riposi con una UI elegante
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-gestore/icon.svg
category: files
version: "1.8.11"
port: 8080

description: >-
  GestOre e la tua app personale per gestire ore lavorate, straordinari,
  riposi, note e dati salvati in SQLite su umbrelOS, pensata per iPhone.

releaseNotes: >-
  GestOre 1.8.11 rende l'avvio ancora piu essenziale: sullo schermo restano soltanto
  il marchio ufficiale e il nome GestOre, con un sottile contorno luminoso, un
  riflesso morbido e il gradiente animato sulla parola Ore. Messaggi, tagline e
  barra non sono piu visibili. Account, documenti e dati restano invariati.

