name: GestOre
tagline: Tieni ore, turni e riposi con una UI elegante
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-gestore/icon.svg
category: files
version: "1.6.1"
port: 8080

description: >-
  GestOre e la tua app personale per gestire ore lavorate, straordinari,
  riposi, note e dati salvati in SQLite su umbrelOS, pensata per iPhone.

releaseNotes: >-
  GestOre 1.6.1 rinnova il Calendario con viste Mese e Agenda, dettaglio
  del giorno selezionato, riepilogo mensile compatto e filtri raccolti
  negli strumenti. Il primo tocco mostra il riepilogo senza aprire
  l'editor, mantenendo intatti dati, nav e funzioni avanzate.

