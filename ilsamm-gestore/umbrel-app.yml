manifestVersion: 1
id: ilsamm-gestore
name: GestOre
tagline: Tieni ore, turni e riposi con una UI elegante
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-gestore/icon.svg
category: files
version: "1.6.5"
port: 8080

description: >-
  GestOre e la tua app personale per gestire ore lavorate, straordinari,
  riposi, note e dati salvati in SQLite su umbrelOS, pensata per iPhone.

releaseNotes: >-
  GestOre 1.6.5 rinnova la sezione Stipendio con una gerarchia piu chiara:
  netto previsto, stato della stima, lordo, trattenute e confronto con il
  cedolino del mese sono ora riuniti in una sola card. Calcolo, nuovo
  cedolino e archivio sono immediatamente accessibili, con riepilogo annuale
  piu leggibile e senza modificare formule o dati salvati.

