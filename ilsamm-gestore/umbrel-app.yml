manifestVersion: 1
id: ilsamm-gestore
name: GestOre
tagline: Tieni ore, turni e riposi con una UI elegante
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-gestore/icon.svg
category: files
version: "1.4.1"
port: 8080

description: >-
  GestOre e la tua app personale per gestire ore lavorate, straordinari,
  riposi, note e dati salvati in SQLite su umbrelOS, pensata per iPhone.

releaseNotes: >-
  GestOre 1.4.1 aggiunge un limite mensile facoltativo alle ore ordinarie
  conteggiate nella stima. Ore registrate, conteggiate ed escluse restano
  distinte, gli straordinari vengono calcolati separatamente e nessun dato
  esistente viene modificato.

