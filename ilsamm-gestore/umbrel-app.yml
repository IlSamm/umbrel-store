manifestVersion: 1
id: ilsamm-gestore
name: GestOre
tagline: Tieni ore, turni e riposi con una UI elegante
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-gestore/icon.svg
category: files
version: "1.8.5"
port: 8080

description: >-
  GestOre e la tua app personale per gestire ore lavorate, straordinari,
  riposi, note e dati salvati in SQLite su umbrelOS, pensata per iPhone.

releaseNotes: >-
  GestOre 1.8.5 introduce transizioni rapide e fluide tra le schermate, card
  che compaiono in sequenza e KPI, grafici e barre che si animano quando cambia
  la vista. Le animazioni rispettano Riduci movimento e non interferiscono con
  inserimento, salvataggio o sincronizzazione dei dati.

