manifestVersion: 1
id: ilsamm-gestore
name: GestOre
tagline: Tieni ore, turni e riposi con una UI elegante
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-gestore/icon.svg
category: files
version: "1.8.7"
port: 8080

description: >-
  GestOre e la tua app personale per gestire ore lavorate, straordinari,
  riposi, note e dati salvati in SQLite su umbrelOS, pensata per iPhone.

releaseNotes: >-
  GestOre 1.8.7 rimuove gli indicatori di scorrimento da tutta l app mantenendo
  lo scorrimento tattile. Numeri, grafici e card non ripartono piu da zero dopo
  aggiornamenti o cambi periodo; solo il cambio reale di schermata conserva una
  transizione breve e discreta. Dati, report e zoom dei documenti restano invariati.

developer: IlSamm
