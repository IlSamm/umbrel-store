id: ilsamm-gestore
name: GestOre
tagline: Tieni ore, turni e riposi con una UI elegante
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-gestore/icon.svg
category: files
version: "1.8.0"
port: 8080

description: >-
  GestOre e la tua app personale per gestire ore lavorate, straordinari,
  riposi, note e dati salvati in SQLite su umbrelOS, pensata per iPhone.

releaseNotes: >-
  GestOre 1.8.0 aggiunge mascotte illustrate e foto profilo, rinnova ricerca,
  ferie, calendario e impostazioni, rende piu chiara la stima stipendio e limita
  lo zoom alle sole foto dei cedolini. I dati gia salvati restano compatibili.

