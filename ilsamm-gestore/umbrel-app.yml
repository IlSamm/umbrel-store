  GestOre 1.6.6 rende piu chiare le aree Ferie, Profilo e Impostazioni,
  aggiunge la scelta di anno e categorie nell'esportazione Calendario e
  rifinisce i report PDF mensile e annuale. I dati esistenti, gli account,
  i saldi ferie e i cedolini restano invariati.

