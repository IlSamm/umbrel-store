manifestVersion: 1
id: ilsamm-gestore
name: GestOre
tagline: Tieni ore, turni e riposi con una UI elegante
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-gestore/icon.svg
category: files
version: "1.8.8"
port: 8080

description: >-
  GestOre e la tua app personale per gestire ore lavorate, straordinari,
  riposi, note e dati salvati in SQLite su umbrelOS, pensata per iPhone.

releaseNotes: >-
  GestOre 1.8.8 sostituisce il movimento dell intera schermata con una comparsa
  leggera e progressiva delle sole card. Titoli, nav, numeri e grafici restano
  stabili, e l effetto non riparte durante salvataggi o cambi periodo. Indicatori
  di scorrimento, dati, report e zoom dei documenti restano invariati.

developer: IlSamm
website: "https://github.com/IlSamm/umbrel-store/tree/master/ilsamm-gestore"
