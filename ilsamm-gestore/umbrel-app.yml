manifestVersion: 1
id: ilsamm-gestore
name: GestOre
tagline: Tieni ore, turni e riposi con una UI elegante
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-gestore/icon.svg
category: files
version: "1.8.14"
port: 8080

description: >-
  GestOre e la tua app personale per gestire ore lavorate, straordinari,
  riposi, note e dati salvati in SQLite su umbrelOS, pensata per iPhone.

releaseNotes: >-
  GestOre 1.8.14 rinnova completamente la schermata Ferie con saldo residuo,
  percentuale disponibile, distinzione tra giorni utilizzati e pianificati,
  prossima assenza e storico ordinato. Le azioni per pianificare, gestire il saldo
  e aprire lo storico sono ora piu chiare su ogni formato iPhone. Corretto anche
  il wordmark della schermata di avvio, che non taglia piu la lettera finale.
  Tutti i dati ferie gia salvati restano invariati e compatibili.

developer: IlSamm
website: "https://github.com/IlSamm/umbrel-store/tree/master/ilsamm-gestore"
dependencies: []
repo: "https://github.com/IlSamm/umbrel-store"
support: "https://github.com/IlSamm/umbrel-store/issues"

