manifestVersion: 1
id: ilsamm-jarvis
name: Jarvis
tagline: Il tuo assistente personale, a voce, sul tuo Umbrel
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-jarvis/icon.svg
category: automation
version: "1.1.0"
port: 8791
requiresHttps: true

description: >-
  Jarvis è un assistente personale in italiano che gira sul tuo Umbrel.
  Comanda la casa tramite Home Assistant (luci, prese, tapparelle, scene),
  tiene le spese e le cose da ricordare, legge i calendari e aggiunge cose
  alla lista della spesa. I comandi di casa, le spese e la memoria funzionano
  senza internet; per le domande vere usa Google Gemini (chiave gratuita) solo
  quando serve. Ascolta in locale con Whisper e risponde con una voce neurale,
  con Piper come voce locale di riserva. L'interfaccia è una costellazione
  animata in cui ogni stella è un dato vero: dispositivi, eventi, spese e ricordi.
  Pronto per i dispositivi vocali come ESP-Mosaico tramite una chiave dedicata.


  Dopo l'installazione apri Jarvis e tocca ⚙ impostazioni: incolla la chiave di
  Gemini e il token di Home Assistant. Il primo avvio scarica i modelli di voce e
  ascolto (circa 2 GB in tutto), quindi serve qualche minuto.

releaseNotes: >-
  Jarvis ora va su internet da solo quando serve: notizie, sport, prezzi, orari e
  fatti recenti con Google, meteo e previsioni anche senza Gemini, e risposte da
  Wikipedia se Gemini non è disponibile. Se un modello gratuito di Gemini è al limite,
  passa da solo a un altro. Si apre in https, così dal telefono puoi parlargli a voce
  (serve il certificato HTTPS di Umbrel installato sul telefono). Nuova città per il meteo.

developer: IlSamm
