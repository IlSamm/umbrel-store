manifestVersion: 1
id: ilsamm-filament-finder
name: Filament Finder
tagline: Scegli il filamento giusto e confronta i prezzi live
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-filament-finder/icon.svg
category: developer
version: "11.1.1"
port: 8765

description: >-
  Filament Finder aiuta a scegliere, confrontare e acquistare filamenti per stampa 3D.
  Include un catalogo tecnico, un advisor per il progetto, compatibilita con le stampanti,
  prezzi live, confronto materiali, calcolo costi e alert locali. I dati personali e lo
  storico continuano a persistere localmente su Umbrel.

releaseNotes: >-
  Corretto il download del riepilogo costi al primo clic dopo una modifica. Risolti gli
  errori di navigazione durante il caricamento del catalogo e con il collegamento da
  tastiera. Gli alert della stessa variante per quantita e filtri diversi non si
  sovrascrivono piu e confrontano solo osservazioni coerenti. Le risposte lente non
  ripristinano elenchi vecchi e non chiudono nuove finestre; le cancellazioni fallite
  possono essere ritentate. Mantenuti tema scuro, calcolatore completo e dati persistenti.

