manifestVersion: 1
id: ilsamm-filament-finder
name: Filament Finder
tagline: Scegli il filamento giusto e monitora i prezzi live
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-filament-finder/icon.svg
category: developer
version: "7.0.0"
port: 8765

description: >-
  Filament Finder consiglia il materiale migliore per ogni stampa 3D in base
  alla stampante, all'uso del pezzo e alle caratteristiche richieste. Confronta
  prezzi live, disponibilita, colori e costo finale per kg, deduplica le varianti
  tra piu negozi e mantiene storico e alert locali per ribassi e ritorni disponibili.

releaseNotes: >-
  Clean UI 7.0: frontend ricostruito da zero. Rimossi i vecchi layer grafici v2-v6
  dal runtime e introdotta una sola interfaccia coerente per Home, Consigliatore,
  Materiali, Prodotti & Prezzi, Confronta, Costi, Alert, Stampanti e Impostazioni.
  Nuova gerarchia visiva mobile-first, catalogo materiali riprogettato, scheda materiale
  più chiara e mercato con miglior affare, prodotti raggruppati, disponibilita, prezzo,
  spedizione, totale e €/kg leggibili. Mantiene backend, tracker, storico, dati tecnici,
  blocco zoom su iPhone e dati persistenti.

