manifestVersion: 1
id: ilsamm-filament-finder
name: Filament Finder
tagline: Scegli il filamento giusto e confronta i prezzi live
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-filament-finder/icon.svg
category: developer
version: "10.6.0"
port: 8765

description: >-
  Filament Finder aiuta a scegliere, confrontare e acquistare filamenti per stampa 3D.
  Include un catalogo tecnico, un advisor per il progetto, compatibilita con le stampanti,
  prezzi live, confronto materiali, calcolo costi e alert locali. I dati personali e lo
  storico continuano a persistere localmente su Umbrel.

releaseNotes: >-
  Marketplace 10.6 con stato esplicito per ogni fonte della ricerca prezzi. Ogni sito mostra
  sempre uno dei quattro esiti OK, Nessun risultato, Errore o Timeout, insieme al numero di
  offerte restituite e alla latenza quando disponibile. Aggiunto un pannello Stato fonti con
  riepilogo completo di tutte le fonti interrogate e dettaglio individuale, cosi un negozio
  senza risultati non viene piu confuso con una fonte non raggiungibile. I chip delle fonti
  usano lo stesso stato e forniscono un dettaglio accessibile tramite tooltip. Restano inclusi
  Smart Deals 10.5, promozioni quantita verificate, multipack, refill, coupon, soglie di
  spedizione gratuita, Bambu Lab EU e ricerca multi-store.

