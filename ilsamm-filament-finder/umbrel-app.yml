manifestVersion: 1
id: ilsamm-filament-finder
name: Filament Finder
tagline: Materiali, compatibilita e prezzi live per la stampa 3D
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-filament-finder/icon.svg
category: developer
version: "9.0.0"
port: 8765

description: >-
  Filament Finder e un workspace locale per scegliere e confrontare filamenti 3D,
  verificare compatibilita con la stampante, consultare schede tecniche, confrontare
  prezzi live e disponibilita, creare alert e mantenere storico e calcoli di costo.
  I dati personali persistono localmente su Umbrel.

releaseNotes: >-
  Filament Finder 9 amplia in modo sostanziale dati e motore prezzi: 67 famiglie di
  materiali, 18 marchi indicizzati, 43 stampanti e 11 fonti prezzo configurate. Nuove
  famiglie includono materiali engineering, compositi, flessibili, supporti, ESD,
  lightweight e polimeri ad alta temperatura. Le schede materiali mostrano piu dati
  tecnici indicativi, compatibilita, drying, abrasivita, velocita, densita e utilizzi.
  Aggiunti AzureFilm, FormFutura e 3D Prima alle fonti, diagnostica per sorgente,
  filtro sorgente e motore prezzi migliorato per offerte/sconti. Aggiunto /api/health
  e una dashboard dati piu completa. La release e distribuita come immagine Docker
  self-contained. Prima della pubblicazione sono stati verificati build amd64/arm64,
  pull anonimo, avvio container, endpoint health/sources e una ricerca live PLA su
  3DJake che ha restituito 22 offerte. Persistenza /data, alert e storico restano invariati.

developer: IlSamm
