manifestVersion: 1
id: ilsamm-filament-finder
name: Filament Finder
tagline: Il centro di controllo completo per ogni filamento 3D
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-filament-finder/icon.svg
category: developer
version: "8.0.1"
port: 8765

description: >-
  Filament Finder 8 e un Material OS locale per la stampa 3D: confronta materiali,
  prodotti e prezzi live, valuta compatibilita con la stampante, mantiene storico e
  alert prezzo, gestisce le bobine personali, suggerisce drying e profili di partenza
  e calcola costi reali e margini. I dati persistono localmente su Umbrel.

releaseNotes: >-
  Hotfix 8.0.1: corretto il bootstrap su Umbrel. Bundle e asset dell'interfaccia vengono
  caricati prima dai file locali gia installati con il Community Store, poi dalla cache
  persistente e solo come ultima possibilita da GitHub. In questo modo un problema DNS,
  timeout o rate limit non impedisce piu al server di aprire la porta 8765 al primo avvio.
  Aggiunti controllo integrita, log di bootstrap e healthcheck locale. Interfaccia Material OS,
  database materiali, prezzi live, storico, alert, Spool Manager e dati persistenti restano invariati.

