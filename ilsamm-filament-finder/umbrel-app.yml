manifestVersion: 1
id: ilsamm-filament-finder
name: Filament Finder
tagline: Materiali, compatibilita e prezzi live per la stampa 3D
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-filament-finder/icon.svg
category: developer
version: "9.1.0"
port: 8765

description: >-
  Filament Finder e un workspace locale per scegliere e confrontare filamenti 3D,
  verificare compatibilita con la stampante, consultare schede tecniche, confrontare
  prezzi live e disponibilita, creare alert e mantenere storico e calcoli di costo.
  I dati personali persistono localmente su Umbrel.

releaseNotes: >-
  Release di riparazione mobile concentrata sui problemi reali della 9.0.0. Sistemati
  i filtri Materiali che perdevano lo stile, la palette colori che poteva trasformarsi
  in colonne giganti, il layout del Material Advisor, il pulsante di aggiornamento dei
  prezzi, le card del marketplace, gli spazi sotto la barra di navigazione e il menu
  Altro. Uniformate le icone con SVG monocromatici e corretti testi/versione nelle
  impostazioni. Il motore prezzi parallelo, le 11 fonti, i 67 materiali, gli alert,
  lo storico e la persistenza /data restano invariati. La UI mobile viene verificata
  automaticamente a viewport iPhone oltre ai test API e del motore prezzi live.

developer: IlSamm
