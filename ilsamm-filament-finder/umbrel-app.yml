manifestVersion: 1
id: ilsamm-filament-finder
name: Filament Finder
tagline: Scegli il filamento giusto e monitora i prezzi live
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-filament-finder/icon.svg
category: developer
version: "5.0.0"
port: 8765

description: >-
  Filament Finder consiglia il materiale migliore per ogni stampa 3D in base
  alla stampante, all'uso del pezzo e alle caratteristiche richieste. Confronta
  prezzi live, disponibilita, colori e costo finale per kg, deduplica le varianti
  tra piu negozi e mantiene storico e alert locali per ribassi e ritorni disponibili.

releaseNotes: >-
  Material Profiles 5.0: catalogo materiali completamente ridisegnato con card premium,
  quick view desktop/mobile e pagine dettaglio complete. Tutte le 25 famiglie attuali
  includono dati di stampa, drying, storage, ugello, camera, AMS/MMU, proprieta tipiche,
  compatibilita, pro/contro, usi ideali, preset, troubleshooting, sicurezza e riferimenti.
  I valori generici sono indicati come range tipici e il TDS della bobina specifica resta
  sempre la fonte definitiva. Backend, prezzi live, alert e storico restano invariati.

