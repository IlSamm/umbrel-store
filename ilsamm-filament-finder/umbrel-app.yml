id: ilsamm-filament-finder
name: Filament Finder
tagline: Scegli il filamento giusto e confronta i prezzi live
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-filament-finder/icon.svg
category: developer
version: "11.0.0"
port: 8765

description: >-
  Filament Finder aiuta a scegliere, confrontare e acquistare filamenti per stampa 3D.
  Include un catalogo tecnico, un advisor per il progetto, compatibilita con le stampanti,
  prezzi live, confronto materiali, calcolo costi e alert locali. I dati personali e lo
  storico continuano a persistere localmente su Umbrel.

releaseNotes: >-
  Nuova interfaccia desktop e mobile con navigazione stabile, catalogo ricercabile e confronto
  materiali. Il consigliere ora considera i limiti della stampante selezionata. Ricerca prezzi
  con filtri per negozio, formato, colore e disponibilita, quantita esplicita in confezioni e
  spedizioni sconosciute chiaramente indicate. Corretti prezzi decimali e pesi multipack;
  rimossi i prezzi dedotti da prodotti vicini o promozioni generiche. Alert creabili, sospendibili
  ed eliminabili, storico consultabile ed esportazione delle notifiche. Dati locali preservati.
  Aggiunti test automatici dei flussi, controlli di accessibilita e verifica del container prima
  della pubblicazione. Gli sconti di carrello non verificabili rimangono da controllare nel negozio.

