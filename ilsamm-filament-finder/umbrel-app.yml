id: ilsamm-filament-finder
name: Filament Finder
tagline: Scegli il filamento giusto e confronta i prezzi live
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-filament-finder/icon.svg
category: developer
version: "10.3.0"
port: 8765

description: >-
  Filament Finder aiuta a scegliere, confrontare e acquistare filamenti per stampa 3D.
  Include un catalogo tecnico, un advisor per il progetto, compatibilita con le stampanti,
  prezzi live, confronto materiali, calcolo costi e alert locali. I dati personali e lo
  storico continuano a persistere localmente su Umbrel.

releaseNotes: >-
  Marketplace prezzi completamente ridisegnato. La ricerca ora presenta un riepilogo con
  miglior totale, miglior prezzo al kg e migliore offerta Bambu ufficiale; mostra subito
  quante offerte arrivano da ogni negozio e permette di filtrare localmente per store,
  marca, colore, testo e disponibilita del totale/spedizione. Aggiunti ordinamento per
  prezzo finale, euro/kg, prezzo prodotto, negozio e marca, risultati progressivi e stato
  delle fonti raccolto in una sezione tecnica richiudibile. Le offerte mostrano in modo
  separato disponibilita, prezzo prodotto, spedizione, totale e costo al kg. Il connettore
  Bambu Lab EU dedicato resta attivo. Schede tecniche, 67 materiali, 43 stampanti, alert,
  storico e persistenza /data restano invariati.

