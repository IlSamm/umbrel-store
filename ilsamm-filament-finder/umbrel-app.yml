manifestVersion: 1
id: ilsamm-filament-finder
name: Filament Finder
tagline: Scegli il filamento giusto e confronta i prezzi live
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-filament-finder/icon.svg
category: developer
version: "12.0.1"
port: 8765

description: >-
  Filament Finder aiuta a scegliere, confrontare e acquistare filamenti per stampa 3D.
  Include un catalogo tecnico, un advisor per il progetto, compatibilita con le stampanti,
  prezzi live, confronto materiali, calcolo costi e alert locali. I dati personali e lo
  storico continuano a persistere localmente su Umbrel.

releaseNotes: >-
  Correzione della navigazione: i menu cambiano sezione all'interno della pagina,
  conservando percorso e parametri dell'app anche in presenza di un indirizzo base
  del contenitore. Rimossa la scomparsa dell'intera schermata durante le transizioni;
  tornare a una sezione gia visitata e immediato. Risposte degli alert non valide non
  bloccano piu il catalogo. Le informazioni del server si aggiornano senza sostituire
  i controlli delle impostazioni. Mantenuti tema scuro, animazioni dei dettagli e dati.

