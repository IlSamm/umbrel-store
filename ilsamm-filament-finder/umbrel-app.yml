manifestVersion: 1
id: ilsamm-filament-finder
name: Filament Finder
tagline: Scegli il filamento giusto e monitora i prezzi live
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-filament-finder/icon.svg
category: developer
version: "6.0.0"
port: 8765

description: >-
  Filament Finder consiglia il materiale migliore per ogni stampa 3D in base
  alla stampante, all'uso del pezzo e alle caratteristiche richieste. Confronta
  prezzi live, disponibilita, colori e costo finale per kg, deduplica le varianti
  tra piu negozi e mantiene storico e alert locali per ribassi e ritorni disponibili.

releaseNotes: >-
  Redesign completo dell'interfaccia. Nuovo linguaggio visivo unico per Home,
  Consigliatore, Materiali, Prodotti & Prezzi, Alert, Stampanti e Impostazioni.
  La sezione mercato e stata ricostruita con miglior affare in evidenza, riepilogo
  chiaro, gruppi prodotto, disponibilita, prezzo prodotto, spedizione, totale e €/kg
  leggibili anche su iPhone. Migliorati sidebar, card, modali, filtri, responsive e
  gerarchia visiva generale. Restano attivi blocco zoom, schede tecniche complete,
  backend, storico, alert e dati persistenti.

