manifestVersion: 1
id: ilsamm-filament-finder
name: Filament Finder
tagline: Il centro di controllo completo per ogni filamento 3D
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-filament-finder/icon.svg
category: developer
version: "8.0.2"
port: 8765

description: >-
  Filament Finder e il centro di controllo locale per la stampa 3D: confronta materiali,
  prodotti e prezzi live, valuta compatibilita con la stampante, mantiene storico e
  alert prezzo e calcola costi reali e margini. I dati persistono localmente su Umbrel.

releaseNotes: >-
  Recovery 8.0.2: individuato e rimosso il vero blocco di avvio, causato da un archivio
  compresso dell'interfaccia v8 corrotto. Filament Finder ora viene distribuito come
  immagine Docker self-contained gia assemblata e verificata, senza download o
  decompressione degli asset all'avvio. Ripristinata temporaneamente l'ultima interfaccia
  professionale v7 verificata, con hook di compatibilita corretto. La build multi-arch
  amd64/arm64, il pull anonimo e l'avvio del container con risposta HTTP su /api/sources
  sono stati testati automaticamente prima della pubblicazione. Prezzi live, storico,
  alert, database materiali, stampanti e dati persistenti restano disponibili.

