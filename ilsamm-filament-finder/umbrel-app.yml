manifestVersion: 1
id: ilsamm-filament-finder
name: Filament Finder
tagline: Scegli il filamento giusto e monitora i prezzi live
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-filament-finder/icon.svg
category: developer
version: "5.1.0"
port: 8765

description: >-
  Filament Finder consiglia il materiale migliore per ogni stampa 3D in base
  alla stampante, all'uso del pezzo e alle caratteristiche richieste. Confronta
  prezzi live, disponibilita, colori e costo finale per kg, deduplica le varianti
  tra piu negozi e mantiene storico e alert locali per ribassi e ritorni disponibili.

releaseNotes: >-
  Technical Sheet 5.1: scheda tecnica materiali completamente ridisegnata con
  navigazione dedicata Panoramica/Stampa/Meccanica/Ambiente/Problemi, layout premium
  desktop e mobile, dati tecnici completi per tutte le 25 famiglie, range fisici e
  meccanici tipici, hardware, drying, storage, sicurezza e troubleshooting. Disabilitati
  pinch zoom, doppio tap zoom e zoom automatico degli input su iPhone. Backend, prezzi,
  alert, storico e dati persistenti restano invariati.

