manifestVersion: 1
id: ilsamm-filament-finder
name: Filament Finder
tagline: Scegli il filamento giusto e confronta i prezzi live
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-filament-finder/icon.svg
category: developer
version: "10.0.0"
port: 8765

description: >-
  Filament Finder aiuta a scegliere, confrontare e acquistare filamenti per stampa 3D.
  Include un catalogo tecnico, un advisor per il progetto, compatibilita con le stampanti,
  prezzi live, confronto materiali, calcolo costi e alert locali. I dati personali e lo
  storico continuano a persistere localmente su Umbrel.

releaseNotes: >-
  Redesign completo dell'interfaccia. La vecchia dashboard non viene piu mostrata: la
  10.0 introduce un frontend mobile-first indipendente con nuova Home, Material Advisor,
  marketplace prezzi, catalogo materiali, schede tecniche, confronto, calcolatore costi,
  alert, stampanti e impostazioni. Ridotti drasticamente bordi, box ripetitivi e uso del
  verde; migliorate gerarchie, tipografia, spaziatura e navigazione su iPhone. Il runtime
  9.x resta nascosto come motore di compatibilita, mentre backend prezzi, 67 materiali,
  43 stampanti, 11 fonti, alert, storico e persistenza /data rimangono invariati.

