manifestVersion: 1
id: ilsamm-filament-finder
name: Filament Finder
tagline: Scegli il filamento giusto e confronta i prezzi live
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-filament-finder/icon.svg
category: developer
version: "12.0.0"
port: 8765

description: >-
  Filament Finder aiuta a scegliere, confrontare e acquistare filamenti per stampa 3D.
  Include un catalogo tecnico, un advisor per il progetto, compatibilita con le stampanti,
  prezzi live, confronto materiali, calcolo costi e alert locali. I dati personali e lo
  storico continuano a persistere localmente su Umbrel.

releaseNotes: >-
  Interfaccia completamente rinnovata: tema scuro, accenti lavanda, pannelli arrotondati,
  nuova grafica 3D e transizioni fluide. Navigazione riorganizzata e barra mobile con
  accesso diretto al calcolatore. Cambiare sezione conserva campi, filtri, pannelli aperti
  e posizione della pagina senza ricostruire le schermate o ricaricare il catalogo.
  I risultati delle ricerche avviate in background vengono aggiornati al ritorno.
  Animazioni disattivabili dalle impostazioni, nel rispetto delle preferenze di sistema.
  Calcoli, alert e dati persistenti restano compatibili con la versione precedente.

developer: IlSamm
