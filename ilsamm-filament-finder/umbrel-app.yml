manifestVersion: 1
id: ilsamm-filament-finder
name: Filament Finder
tagline: Scegli il filamento giusto e confronta i prezzi live
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-filament-finder/icon.svg
category: developer
version: "10.1.0"
port: 8765

description: >-
  Filament Finder aiuta a scegliere, confrontare e acquistare filamenti per stampa 3D.
  Include un catalogo tecnico, un advisor per il progetto, compatibilita con le stampanti,
  prezzi live, confronto materiali, calcolo costi e alert locali. I dati personali e lo
  storico continuano a persistere localmente su Umbrel.

releaseNotes: >-
  Nuova scheda materiale a due livelli. La vista iniziale mostra solo le informazioni
  essenziali: profilo, compatibilita, facilita, resistenza, calore, finitura, temperature,
  velocita e usi ideali. Un nuovo pulsante Scheda tecnica completa apre i dettagli avanzati
  con setup di stampa, enclosure, ventola, asciugatura, umidita, ugello, densita, proprieta,
  casi d'uso, limiti e problemi comuni. I valori non presenti nel dataset vengono marcati
  chiaramente come indicativi. Backend prezzi, 67 materiali, 43 stampanti, 11 fonti, alert,
  storico e persistenza /data restano invariati.

