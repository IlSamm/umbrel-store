id: ilsamm-filament-finder
name: Filament Finder
tagline: Scegli il filamento giusto e confronta i prezzi live
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-filament-finder/icon.svg
category: developer
version: "10.5.0"
port: 8765

description: >-
  Filament Finder aiuta a scegliere, confrontare e acquistare filamenti per stampa 3D.
  Include un catalogo tecnico, un advisor per il progetto, compatibilita con le stampanti,
  prezzi live, confronto materiali, calcolo costi e alert locali. I dati personali e lo
  storico continuano a persistere localmente su Umbrel.

releaseNotes: >-
  Marketplace 10.5 con motore Smart Deals. La ricerca non confronta piu soltanto il prezzo
  della singola bobina: rileva e valuta promozioni quantita esplicite, multipack, refill,
  prezzi barrati Shopify, regole X al prezzo di Y, codici promo mostrati in pagina e soglie
  di spedizione gratuita. Per richieste da 3, 4, 6, 10 kg e oltre calcola quante confezioni
  e bobine servono, applica solo sconti verificabili sulla pagina del prodotto e ricalcola
  totale effettivo, costo al kg e risparmio rispetto al prezzo normale. Le offerte con prezzo
  promozionale possono quindi salire realmente nel ranking Miglior totale. Aggiunto un pannello
  Acquisto intelligente con le migliori combinazioni per la quantita scelta, badge promo e
  risparmio, oltre a nuove quantita fino a 50 kg. I codici coupon vengono segnalati ma non sono
  sommati automaticamente ad altri sconti quando la cumulabilita non e verificabile. Restano
  invariati catalogo tecnico, Bambu Lab EU, ricerca parallela multi-store, alert e storico.

