id: ilsamm-filament-finder
name: Filament Finder
tagline: Scegli il filamento giusto e confronta i prezzi live
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-filament-finder/icon.svg
category: developer
version: "10.7.0"
port: 8765

description: >-
  Filament Finder aiuta a scegliere, confrontare e acquistare filamenti per stampa 3D.
  Include un catalogo tecnico, un advisor per il progetto, compatibilita con le stampanti,
  prezzi live, confronto materiali, calcolo costi e alert locali. I dati personali e lo
  storico continuano a persistere localmente su Umbrel.

releaseNotes: >-
  Marketplace 10.7 con diagnostica avanzata per ogni fonte. La schermata Ricerca prezzi mostra
  URL realmente chiamato, codice HTTP, tempo della fonte, tempo della richiesta HTTP, numero di
  risultati, numero di richieste e motivo preciso di errore o timeout. Le fonti in Errore o
  Timeout hanno il nuovo pulsante Riprova fonte, che interroga soltanto quel negozio mantenendo
  materiale e quantita correnti senza rilanciare l'intero marketplace. Migliorati inoltre colori,
  contrasto, leggibilita dei testi, badge e layout responsive del pannello fonti. Restano inclusi
  gli stati OK, Nessun risultato, Errore e Timeout e tutte le funzioni Smart Deals precedenti.

