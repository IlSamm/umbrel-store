id: ilsamm-filament-finder
name: Filament Finder
tagline: Il centro di controllo completo per ogni filamento 3D
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-filament-finder/icon.svg
category: developer
version: "8.0.0"
port: 8765

description: >-
  Filament Finder 8 e un Material OS locale per la stampa 3D: confronta materiali,
  prodotti e prezzi live, valuta compatibilita con la stampante, mantiene storico e
  alert prezzo, gestisce le bobine personali, suggerisce drying e profili di partenza
  e calcola costi reali e margini. I dati persistono localmente su Umbrel.

releaseNotes: >-
  Filament Finder 8.0 introduce una nuova interfaccia Material OS desktop e mobile,
  un database tecnico esteso con oltre 40 famiglie e varianti di materiali, ricerca
  e schede complete, confronto fino a quattro materiali, Smart Material Advisor,
  Spool Manager con residuo e stato di essiccazione, Drying Lab, generatore di profili
  di partenza e calcolo costi con energia, scarto e usura macchina. Il market tracker
  continua a usare il backend locale con prezzi live, storico, disponibilita e alert
  persistenti. Aggiunto catalogo marche esteso e nuova esperienza responsive stile
  workstation per la stampa 3D.

