manifestVersion: 1
id: ilsamm-filament-finder
name: Filament Finder
tagline: Scegli il filamento giusto e confronta i prezzi live
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-filament-finder/icon.svg
category: developer
version: "11.1.0"
port: 8765

description: >-
  Filament Finder aiuta a scegliere, confrontare e acquistare filamenti per stampa 3D.
  Include un catalogo tecnico, un advisor per il progetto, compatibilita con le stampanti,
  prezzi live, confronto materiali, calcolo costi e alert locali. I dati personali e lo
  storico continuano a persistere localmente su Umbrel.

releaseNotes: >-
  Nuovo calcolatore del costo prodotto: peso netto della confezione, supporti e spurghi,
  durata in ore e minuti, energia, ammortamento e manutenzione della stampante, ristampe,
  preparazione e finitura, imballaggio e costi aggiuntivi. Riepilogo aggiornato mentre scrivi,
  costo per pezzo e per lotto, prezzo di vendita facoltativo con margine, commissioni e IVA
  configurabili. Salvataggio dell'ultimo calcolo nel browser ed esportazione del riepilogo.
  Mantenuti tema scuro, dati persistenti e tutte le funzionalita della versione 11.

