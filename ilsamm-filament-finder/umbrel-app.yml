manifestVersion: 1
id: ilsamm-filament-finder
name: Filament Finder
tagline: Scegli il filamento giusto e confronta i prezzi live
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-filament-finder/icon.svg
category: developer
version: "10.4.0"
port: 8765

description: >-
  Filament Finder aiuta a scegliere, confrontare e acquistare filamenti per stampa 3D.
  Include un catalogo tecnico, un advisor per il progetto, compatibilita con le stampanti,
  prezzi live, confronto materiali, calcolo costi e alert locali. I dati personali e lo
  storico continuano a persistere localmente su Umbrel.

releaseNotes: >-
  Ricerca prezzi 10.4 resa realmente confrontabile. La quantita viene ora interpretata come
  kg di materiale invece che come semplice numero di bobine: il marketplace legge il peso
  delle confezioni, calcola quante confezioni servono, ricalcola totale e costo al kg e segnala
  eventuale materiale acquistato in eccesso. Aggiunti filtro automatico di accessori, campioni,
  materiali e varianti non pertinenti, controllo dei prezzi sospetti, riconoscimento dei pack,
  refill e formati 250 g/500 g/750 g/1 kg/2 kg, deduplicazione piu robusta e ranking di
  pertinenza. I risultati senza peso verificabile restano disponibili come fallback ma con
  confidenza inferiore. La ricerca continua a interrogare le fonti in parallelo e mantiene
  il connettore Bambu Lab EU, i filtri marketplace, le schede tecniche, gli alert e lo storico.

