manifestVersion: 1
id: ilsamm-filament-finder
name: Filament Finder
tagline: Scegli il filamento giusto e monitora i prezzi live
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-filament-finder/icon.svg
category: developer
version: "5.2.0"
port: 8765

description: >-
  Filament Finder consiglia il materiale migliore per ogni stampa 3D in base
  alla stampante, all'uso del pezzo e alle caratteristiche richieste. Confronta
  prezzi live, disponibilita, colori e costo finale per kg, deduplica le varianti
  tra piu negozi e mantiene storico e alert locali per ribassi e ritorni disponibili.

releaseNotes: >-
  Material Sheet 5.2: scheda materiale riprogettata dopo il feedback mobile. Hero piu
  compatto, miglior prezzo live visibile direttamente nella scheda, CTA Prezzi/Confronta/Alert,
  metriche in card, tab Panoramica/Stampa/Proprieta/Uso/Problemi, layout mobile fullscreen
  con barra azioni fissa e meno spazio vuoto. Restano attivi il blocco zoom iPhone e tutti
  i dati tecnici delle 25 famiglie introdotti nelle versioni precedenti. Backend, alert,
  storico e dati persistenti restano invariati.

developer: IlSamm
