id: ilsamm-filament-finder
name: Filament Finder
tagline: Scegli il filamento giusto e confronta i prezzi live
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-filament-finder/icon.svg
category: developer
version: "10.2.0"
port: 8765

description: >-
  Filament Finder aiuta a scegliere, confrontare e acquistare filamenti per stampa 3D.
  Include un catalogo tecnico, un advisor per il progetto, compatibilita con le stampanti,
  prezzi live, confronto materiali, calcolo costi e alert locali. I dati personali e lo
  storico continuano a persistere localmente su Umbrel.

releaseNotes: >-
  Scheda tecnica 10.2 riorganizzata: i dati chiave restano subito visibili e la parte
  avanzata e divisa in cinque sezioni richiudibili — Stampa, Asciugatura, Compatibilita,
  Proprieta e Problemi comuni. Rifatta anche la parte prezzi: nuovo connettore dedicato
  Bambu Lab EU che legge le varianti europee strutturate dal catalogo ufficiale, stato e
  numero offerte mostrati per ogni fonte, miglior offerta per negozio e risultati completi
  raggruppati per store. Una fonte lenta o senza risultati non viene piu nascosta dietro le
  offerte di un singolo negozio. Backend, 67 materiali, 43 stampanti, alert, storico e
  persistenza /data restano invariati.

