<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0e0e14" />
    <meta
      name="description"
      content="Il tuo laboratorio dei filamenti: materiali, compatibilità e prezzi in un unico posto."
    />
    <title>Filament Finder</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/app.css?v=1200" />
    <script type="module" src="/app.mjs?v=1200"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Vai al contenuto</a>
    <aside class="sidebar">
      <a class="brand" href="#home"
        ><span class="brand-icon" aria-hidden="true"
          ><svg viewBox="0 0 32 32">
            <path d="M8 24V11a4 4 0 0 1 4-4h13M8 15h13M15 25V12" /></svg></span
        ><span
          >filament<span class="brand-light">finder</span
          ><small>MAKE. PRINT. REPEAT.</small></span
        ></a
      >
      <nav id="navigation" aria-label="Navigazione principale"></nav>
      <div class="sidebar-bottom">
        <a class="sidebar-shortcut" href="#cost"
          ><span>Ogni idea ha un valore.</span
          ><strong
            >Calcola la tua prossima stampa
            <span aria-hidden="true">↗</span></strong
          ></a
        >
        <span class="status-dot"></span
        ><span id="server-status">Connessione in corso</span
        ><small>Filament Finder · Edizione 12</small>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="breadcrumb">
          <span class="breadcrumb-context">IL TUO LABORATORIO 3D</span
          ><strong id="page-name">Panoramica</strong>
        </div>
        <button id="printer-button" class="printer-button" type="button">
          Scegli stampante
        </button>
      </header>
      <main id="main" tabindex="-1">
        <div class="loading" role="status">Caricamento del laboratorio…</div>
      </main>
      <footer>
        <span class="footer-brand">filamentfinder <span>© 2026</span></span>
        <span>Buone idee. Ottime stampe.</span>
      </footer>
    </div>
    <dialog id="detail-dialog" aria-labelledby="dialog-title">
      <div class="dialog-header">
        <h2 id="dialog-title"></h2>
        <button
          id="close-dialog"
          class="icon-button"
          aria-label="Chiudi finestra"
          type="button"
        >
          ×
        </button>
      </div>
      <div id="dialog-content"></div>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <noscript>Attiva JavaScript per usare Filament Finder.</noscript>
  </body>
</html>
