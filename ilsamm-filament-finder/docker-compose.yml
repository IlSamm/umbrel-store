version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: ilsamm-filament-finder_server_1
      APP_PORT: 8765

  server:
    image: python:3.13-slim
    init: true
    restart: on-failure
    stop_grace_period: 15s
    command:
      - sh
      - -c
      - >-
        set -eu &&
        rm -rf /tmp/filament-finder /tmp/filament-finder.zip &&
        mkdir -p /tmp/filament-finder &&
        python -c "import urllib.request; urllib.request.urlretrieve('https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-filament-finder/app.zip','/tmp/filament-finder.zip')" &&
        python -m zipfile -e /tmp/filament-finder.zip /tmp/filament-finder &&
        cd /tmp/filament-finder/Filament_Finder_Studio &&
        exec python server.py
    environment:
      TZ: Europe/Rome
      FILAMENT_FINDER_PORT: 8765
      FILAMENT_FINDER_DATA_DIR: /data
      FILAMENT_FINDER_CACHE_TTL: 900
      FILAMENT_FINDER_MONITOR_INTERVAL: 900
    volumes:
      - ${APP_DATA_DIR}/data:/data
    security_opt:
      - no-new-privileges:true
