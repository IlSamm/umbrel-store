version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: ilsamm-filament-finder_server_1
      APP_PORT: 8765

  server:
    image: ghcr.io/ilsamm/filament-finder:9.0.0
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      TZ: Europe/Rome
      FILAMENT_FINDER_PORT: 8765
      FILAMENT_FINDER_DATA_DIR: /data
      FILAMENT_FINDER_CACHE_TTL: 900
      FILAMENT_FINDER_MONITOR_INTERVAL: 900
    volumes:
      - ${APP_DATA_DIR}/data:/data
    security_opt:
      - no-new-privileges:true
