version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: ilsamm-filament-finder_server_1
      APP_PORT: 8765

  server:
    image: python:3.13-slim
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    command:
      - python
      - -u
      - -c
      - |
        import base64
        import gzip
        import hashlib
        import os
        from pathlib import Path
        import sys
        import time
        import urllib.request
        import zipfile

        BASE = "https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-filament-finder/"
        BOOT = Path("/bootstrap")
        CACHE = Path("/data/boot-cache")
        ROOT = Path("/tmp/filament-finder/Filament_Finder_Studio")
        EXPECTED = "1764fe238c7197691d59a8bb728fce3bcc1961c9f4827f4317b80cb1aa226e68"
        CACHE.mkdir(parents=True, exist_ok=True)

        def atomic_cache(path, data):
            tmp = path.with_suffix(path.suffix + ".tmp")
            tmp.write_bytes(data)
            tmp.replace(path)

        def load_asset(cache_name, relative_path, validate):
            local = BOOT / relative_path
            cached = CACHE / cache_name

            if local.is_file():
                try:
                    data = local.read_bytes()
                    validate(data)
                    atomic_cache(cached, data)
                    print("Using local Umbrel asset:", relative_path, flush=True)
                    return data
                except Exception as exc:
                    print("Local asset invalid:", relative_path, str(exc), flush=True)

            if cached.is_file():
                try:
                    data = cached.read_bytes()
                    validate(data)
                    print("Using verified cached asset:", cache_name, flush=True)
                    return data
                except Exception as exc:
                    print("Cached asset invalid:", cache_name, str(exc), flush=True)

            url = BASE + relative_path
            last_error = None
            for attempt in range(3):
                try:
                    request = urllib.request.Request(url, headers={"User-Agent": "FilamentFinder/8.0.1"})
                    with urllib.request.urlopen(request, timeout=15) as response:
                        data = response.read()
                    validate(data)
                    atomic_cache(cached, data)
                    print("Downloaded fallback asset:", relative_path, flush=True)
                    return data
                except Exception as exc:
                    last_error = exc
                    print("Fallback download failed:", relative_path, attempt + 1, str(exc), flush=True)
                    time.sleep(attempt + 1)
            raise RuntimeError("Missing startup asset %s: %s" % (relative_path, last_error))

        def validate_part(data):
            if not data or len(data) < 16:
                raise ValueError("Invalid bundle part")

        def validate_b64gz(data):
            decoded = base64.b64decode(data, validate=True)
            output = gzip.decompress(decoded)
            if not output:
                raise ValueError("Empty decoded asset")

        def validate_plain(data):
            if not data or len(data) < 32:
                raise ValueError("Empty asset")

        def check_bundle(encoded):
            raw = base64.b64decode(encoded, validate=True)
            actual = hashlib.sha256(raw).hexdigest()
            if actual != EXPECTED:
                raise ValueError("Bundle SHA256 mismatch: " + actual)
            return raw

        def unpack_overlay(filename, relative_path, compressed=True):
            validator = validate_b64gz if compressed else validate_plain
            data = load_asset(filename.replace("/", "_"), relative_path, validator)
            output = gzip.decompress(base64.b64decode(data, validate=True)) if compressed else data
            destination = ROOT / filename
            destination.parent.mkdir(parents=True, exist_ok=True)
            destination.write_bytes(output)

        def start():
            parts = [
                load_asset("app.b64.%02d" % i, "bundle/app.b64.%02d" % i, validate_part)
                for i in range(6)
            ]
            encoded = b"".join(parts)
            try:
                raw_zip = check_bundle(encoded)
                atomic_cache(CACHE / "verified-bundle.b64", encoded)
            except Exception as exc:
                backup = CACHE / "verified-bundle.b64"
                if not backup.is_file():
                    raise
                encoded = backup.read_bytes()
                raw_zip = check_bundle(encoded)
                print("Using last verified complete bundle after:", str(exc), flush=True)

            archive = CACHE / "verified-bundle.zip"
            archive.write_bytes(raw_zip)
            with zipfile.ZipFile(archive) as z:
                z.extractall("/tmp/filament-finder")

            if not (ROOT / "server.py").is_file():
                raise RuntimeError("server.py not found after bundle extraction")

            unpack_overlay("materials-v5-data.js", "ui-v5/materials-v5-data.js.b64gz")
            unpack_overlay("techsheet-v51-data.js", "ui-v51/techsheet-v51-data.js.b64gz")
            unpack_overlay("materials-v8-data.js", "ui-v8/materials-v8-data.js", False)
            unpack_overlay("index.html", "ui-v8/index.html.b64gz")
            unpack_overlay("v8.css", "ui-v8/v8.css.b64gz")
            unpack_overlay("v8.js", "ui-v8/v8.js.b64gz")

            os.chdir(ROOT)
            print("Bootstrap complete. Starting Filament Finder on 0.0.0.0:8765", flush=True)
            os.execv(sys.executable, [sys.executable, "-u", "server.py"])

        start()
    environment:
      TZ: Europe/Rome
      FILAMENT_FINDER_PORT: 8765
      FILAMENT_FINDER_DATA_DIR: /data
      FILAMENT_FINDER_CACHE_TTL: 900
      FILAMENT_FINDER_MONITOR_INTERVAL: 900
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ./bundle:/bootstrap/bundle:ro
      - ./ui-v5:/bootstrap/ui-v5:ro
      - ./ui-v51:/bootstrap/ui-v51:ro
      - ./ui-v8:/bootstrap/ui-v8:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/sources', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
