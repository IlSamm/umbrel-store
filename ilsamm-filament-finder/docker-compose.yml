version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: ilsamm-filament-finder_server_1
      APP_PORT: 8765

  server:
    image: python:3.13-slim
    restart: on-failure
    stop_grace_period: 15s
    working_dir: /tmp/filament-finder/Filament_Finder_Studio
    command:
      - sh
      - -c
      - >-
        rm -rf /tmp/filament-finder &&
        mkdir -p /tmp/filament-finder &&
        python -m zipfile -e /package/app.zip /tmp/filament-finder &&
        cd /tmp/filament-finder/Filament_Finder_Studio &&
        python server.py
    environment:
      TZ: Europe/Rome
      FILAMENT_FINDER_PORT: 8765
      FILAMENT_FINDER_DATA_DIR: /data
      FILAMENT_FINDER_CACHE_TTL: 900
      FILAMENT_FINDER_MONITOR_INTERVAL: 900
    volumes:
      - ./app.zip:/package/app.zip:ro
      - ${APP_DATA_DIR}/data:/data
    security_opt:
      - no-new-privileges:true
