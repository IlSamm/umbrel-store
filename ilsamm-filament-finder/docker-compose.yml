version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: ilsamm-filament-finder_server_1
      APP_PORT: 8765

  server:
    image: python:3.13-slim
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    command:
      - python
      - -u
      - -c
      - |
        import base64
        import gzip
        import hashlib
        import os
        from pathlib import Path
        import sys
        import time
        import urllib.request
        import zipfile
        
        BASE = "https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-filament-finder/"
        CACHE = Path("/data/boot-cache")
        ROOT = Path("/tmp/filament-finder/Filament_Finder_Studio")
        EXPECTED = "1764fe238c7197691d59a8bb728fce3bcc1961c9f4827f4317b80cb1aa226e68"
        CACHE.mkdir(parents=True, exist_ok=True)
        
        def get_cached(name, url, validate=None):
            destination = CACHE / name
            for attempt in range(3):
                try:
                    request = urllib.request.Request(url, headers={"User-Agent": "FilamentFinder/8.0"})
                    with urllib.request.urlopen(request, timeout=20) as response:
                        data = response.read()
                    if validate:
                        validate(data)
                    temporary = destination.with_suffix(destination.suffix + ".tmp")
                    temporary.write_bytes(data)
                    temporary.replace(destination)
                    print("Downloaded:", name, flush=True)
                    return data
                except Exception as exc:
                    print("Download failed:", name, attempt + 1, str(exc), flush=True)
                    time.sleep(attempt + 1)
            if destination.is_file():
                data = destination.read_bytes()
                if validate:
                    validate(data)
                print("Using cached:", name, flush=True)
                return data
            raise RuntimeError("Missing startup asset: " + name)
        
        def check_bundle(data):
            raw = base64.b64decode(data, validate=True)
            if hashlib.sha256(raw).hexdigest() != EXPECTED:
                raise ValueError("Bundle SHA256 mismatch")
        
        def unpack_asset(filename, remote, compressed=True):
            def verify(data):
                if compressed:
                    gzip.decompress(base64.b64decode(data))
                elif not data:
                    raise ValueError("Empty asset")
            data = get_cached(filename.replace("/", "_"), BASE + remote, verify)
            output = gzip.decompress(base64.b64decode(data)) if compressed else data
            (ROOT / filename).write_bytes(output)
        
        def start():
            # Download each part separately; once a complete bundle is verified, persist it.
            def validate_part(data):
                if not data or len(data) < 16:
                    raise ValueError("Invalid bundle part")
            parts = [get_cached("app.b64.%02d" % i, BASE + "bundle/app.b64.%02d" % i, validate_part) for i in range(6)]
            encoded = b"".join(parts)
            try:
                check_bundle(encoded)
            except Exception:
                backup = CACHE / "verified-bundle.b64"
                if not backup.is_file():
                    raise
                encoded = backup.read_bytes()
                check_bundle(encoded)
                print("Using last verified bundle", flush=True)
            (CACHE / "verified-bundle.b64").write_bytes(encoded)
            archive = CACHE / "verified-bundle.zip"
            archive.write_bytes(base64.b64decode(encoded))
            with zipfile.ZipFile(archive) as z:
                z.extractall("/tmp/filament-finder")
            if not (ROOT / "server.py").is_file():
                raise RuntimeError("server.py not found in bundle")
            unpack_asset("materials-v5-data.js", "ui-v5/materials-v5-data.js.b64gz")
            unpack_asset("techsheet-v51-data.js", "ui-v51/techsheet-v51-data.js.b64gz")
            unpack_asset("materials-v8-data.js", "ui-v8/materials-v8-data.js", False)
            for name in ("index.html", "v8.css", "v8.js"):
                unpack_asset(name, "ui-v8/" + name + ".b64gz")
            os.chdir(ROOT)
            print("Starting Filament Finder server on port 8765", flush=True)
            os.execv(sys.executable, [sys.executable, "-u", "server.py"])
        
        start()
    environment:
      TZ: Europe/Rome
      FILAMENT_FINDER_PORT: 8765
      FILAMENT_FINDER_DATA_DIR: /data
      FILAMENT_FINDER_CACHE_TTL: 900
      FILAMENT_FINDER_MONITOR_INTERVAL: 900
    volumes:
      - ${APP_DATA_DIR}/data:/data
    security_opt:
      - no-new-privileges:true
