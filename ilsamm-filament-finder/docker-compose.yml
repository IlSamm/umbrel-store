version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: ilsamm-filament-finder_server_1
      APP_PORT: 8765

  server:
    image: python:3.13-slim
    init: true
    restart: on-failure
    stop_grace_period: 15s
    command:
      - sh
      - -c
      - >-
        set -eu &&
        rm -rf /tmp/filament-finder /tmp/ff.zip /tmp/ff.b64 &&
        mkdir -p /tmp/filament-finder &&
        python -c "import urllib.request; base='https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-filament-finder/bundle/app.b64.'; open('/tmp/ff.b64','wb').write(b''.join(urllib.request.urlopen(base+f'{i:02d}').read() for i in range(6)))" &&
        python -c "import base64,hashlib; raw=base64.b64decode(open('/tmp/ff.b64','rb').read()); expected='1764fe238c7197691d59a8bb728fce3bcc1961c9f4827f4317b80cb1aa226e68'; actual=hashlib.sha256(raw).hexdigest(); assert actual==expected, f'Bundle SHA256 mismatch: {actual}'; open('/tmp/ff.zip','wb').write(raw)" &&
        python -m zipfile -e /tmp/ff.zip /tmp/filament-finder &&
        python -c "import urllib.request,base64,gzip; from pathlib import Path; root=Path('/tmp/filament-finder/Filament_Finder_Studio'); base2='https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-filament-finder/ui-v2/'; root.joinpath('index.html').write_bytes(b''.join(urllib.request.urlopen(base2+f'index.{i:02d}.txt').read() for i in range(3))); root.joinpath('styles.css').write_bytes(b''.join(urllib.request.urlopen(base2+f'styles.{i:02d}.txt').read() for i in range(3))); base3='https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-filament-finder/ui-v3/'; urllib.request.urlretrieve(base3+'professional.css',root/'professional.css'); urllib.request.urlretrieve(base3+'ui-v3.js',root/'ui-v3.js'); base4='https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-filament-finder/ui-v4/'; root.joinpath('premium-v4.css').write_bytes(gzip.decompress(base64.b64decode(urllib.request.urlopen(base4+'premium-v4.css.b64gz').read()))); root.joinpath('ui-v4.js').write_bytes(gzip.decompress(base64.b64decode(urllib.request.urlopen(base4+'ui-v4.js.b64gz').read()))); base5='https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-filament-finder/ui-v5/'; root.joinpath('materials-v5-data.js').write_bytes(gzip.decompress(base64.b64decode(urllib.request.urlopen(base5+'materials-v5-data.js.b64gz').read()))); root.joinpath('materials-v5-ui.js').write_bytes(gzip.decompress(base64.b64decode(urllib.request.urlopen(base5+'materials-v5-ui.js.b64gz').read()))); root.joinpath('materials-v5.css').write_bytes(gzip.decompress(base64.b64decode(urllib.request.urlopen(base5+'materials-v5.css.b64gz').read()))); p=root/'index.html'; s=p.read_text(encoding='utf-8'); s=s.replace('</head>','<link rel=\"stylesheet\" href=\"professional.css?v=300\"><link rel=\"stylesheet\" href=\"premium-v4.css?v=400\"><link rel=\"stylesheet\" href=\"materials-v5.css?v=500\"></head>'); s=s.replace('<script src=\"app.js\"></script>','<script src=\"materials-v5-data.js?v=500\"></script><script src=\"app.js\"></script>'); s=s.replace('<script src=\"ui-v2.js\"></script>','<script src=\"ui-v3.js?v=300\"></script><script src=\"ui-v4.js?v=400\"></script><script src=\"materials-v5-ui.js?v=500\"></script>'); p.write_text(s,encoding='utf-8')" &&
        cd /tmp/filament-finder/Filament_Finder_Studio &&
        exec python server.py
    environment:
      TZ: Europe/Rome
      FILAMENT_FINDER_PORT: 8765
      FILAMENT_FINDER_DATA_DIR: /data
      FILAMENT_FINDER_CACHE_TTL: 900
      FILAMENT_FINDER_MONITOR_INTERVAL: 900
    volumes:
      - ${APP_DATA_DIR}/data:/data
    security_opt:
      - no-new-privileges:true
