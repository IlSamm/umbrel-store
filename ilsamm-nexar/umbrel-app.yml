manifestVersion: 1
id: ilsamm-nexar
name: NEXAR
tagline: Accendi e controlla il tuo PC Windows, anche da fuori casa
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-nexar/app/icon.png
category: networking
version: "1.0.2"
port: 8792

description: >-
  NEXAR su Umbrel resta sempre acceso in casa e sveglia il tuo PC Windows con Wake-on-LAN quando lo
  chiedi dall'app per Mac, dal link sul telefono o dal bot Telegram, da qualunque rete. Apre anche la
  dashboard completa del PC direttamente da Umbrel, senza altre password. Si collega una volta sola:
  apri NEXAR sul PC, vai su Accensione, premi Collega Umbrel e incolla il codice qui.

releaseNotes: >-
  Accensione per tutti: NEXAR sul PC (1.0.83 o più nuova) ha il pulsante Prova in Accensione, e l'app qui
  risponde dicendo se vede il PC e se ha il bot Telegram, con un messaggio anche su Telegram. Se colleghi o
  cambi il bot Telegram sul PC dopo aver incollato il codice, l'app lo prende da sola. Quando il PC si accende
  e legge già il bot, l'app si fa da parte invece di contendersi i messaggi. Il messaggio sul BIOS vale per
  tutte le marche di scheda madre.

developer: IlSamm
