manifestVersion: 1
id: ilsamm-nexar
name: NEXAR
tagline: Accendi e controlla il tuo PC Windows, anche da fuori casa
icon: https://raw.githubusercontent.com/IlSamm/umbrel-store/master/ilsamm-nexar/app/icon.png
category: networking
version: "1.0.3"
port: 8792

description: >-
  NEXAR su Umbrel resta sempre acceso in casa e sveglia il tuo PC Windows con Wake-on-LAN quando lo
  chiedi dall'app per Mac, dal link sul telefono o dal bot Telegram, da qualunque rete. Apre anche la
  dashboard completa del PC direttamente da Umbrel, senza altre password. Si collega una volta sola:
  apri NEXAR sul PC, vai su Accensione, premi Collega Umbrel e incolla il codice qui.

releaseNotes: >-
  Telegram senza messaggi persi: l'app qui risponde solo ai messaggi che nessuno ha letto, quindi non ruba
  più i comandi a NEXAR sul PC acceso, anche se Umbrel non riesce a raggiungerlo (firewall o rete diversa).
  NEXAR sul PC (1.0.91 o più nuova) avvisa quando sta leggendo il bot e quando si spegne: da spento /accendi
  funziona subito. Se scrivi /accendi col PC già acceso te lo dice invece di mandare un altro segnale.

developer: IlSamm
website: "https://github.com/IlSamm/NEXAR"
dependencies: []
repo: "https://github.com/IlSamm/NEXAR"
support: "https://github.com/IlSamm/NEXAR/issues"

gallery: []
path: "/"
defaultUsername: ""
defaultPassword: ""
